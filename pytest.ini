[tool:pytest]
minversion = 6.0
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
    --junit-xml=junit-report.xml
    --maxfail=10
    -v
    --tb=short
    --durations=10

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests - test individual components in isolation
    integration: Integration tests - test component interactions
    e2e: End-to-end tests - test complete user workflows
    performance: Performance tests - load, stress, and soak testing
    parallel: Tests specifically for parallel processing capabilities
    agent: Tests for agent behavior and decision making
    websocket: Tests for WebSocket communication
    database: Tests for database operations
    ai: Tests for AI model integrations
    slow: Tests that take longer to run (marked with -m "not slow" for CI)
    load: Load testing scenarios
    stress: Stress testing scenarios
    soak: Soak testing scenarios
    spike: Spike testing scenarios

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

asyncio_mode = auto

timeout = 300
timeout_method = thread