[tool:pytest]
minversion = 6.0
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --cov=source_code
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=85
    --durations=10
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, external services)
    e2e: End-to-end tests (full user journeys)
    load: Load and performance tests
    security: Security and vulnerability tests
    slow: Tests that take more than 1 second
    database: Tests requiring database connection
    external: Tests requiring external services
    auth: Authentication and authorization tests
    api: API endpoint tests
    websocket: WebSocket connection tests
    browser: Browser-based tests
    mobile: Mobile responsive tests
    smoke: Smoke tests for critical functionality
    regression: Regression tests for known issues
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:websockets.*
    ignore::UserWarning:fastapi.*
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S