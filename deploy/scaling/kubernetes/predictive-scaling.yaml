---
# Predictive Auto-scaling Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: predictive-scaling-config
  namespace: dmlog
  labels:
    app: dmlog
    component: predictive-scaling
data:
  config.yaml: |
    # Predictive Scaling Configuration
    prediction:
      # ML Model Configuration
      models:
        traffic_forecasting:
          type: "lstm"
          window_size: 24h
          prediction_horizon: 2h
          update_interval: 30m
          features:
            - "historical_traffic"
            - "time_of_day"
            - "day_of_week"
            - "seasonal_patterns"
            - "special_events"

        resource_usage:
          type: "gradient_boosting"
          window_size: 12h
          prediction_horizon: 1h
          update_interval: 15m
          features:
            - "cpu_utilization"
            - "memory_usage"
            - "request_rate"
            - "response_time"

      # Scaling Policies
      policies:
        proactive_scale_up:
          trigger_threshold: 0.8
          prediction_confidence: 0.7
          scale_factor: 1.5
          lead_time: 10m

        proactive_scale_down:
          trigger_threshold: 0.3
          prediction_confidence: 0.8
          scale_factor: 0.8
          lead_time: 20m

        emergency_scale:
          trigger_threshold: 0.95
          immediate_scale: true
          scale_factor: 2.0

      # Data Sources
      data_sources:
        prometheus:
          endpoint: "http://prometheus-service.monitoring.svc.cluster.local:9090"
          metrics:
            - "rate(http_requests_total[5m])"
            - "rate(container_cpu_usage_seconds_total[5m])"
            - "container_memory_working_set_bytes"
            - "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))"

        external:
          - type: "calendar"
            events: ["holidays", "promotions", "maintenance"]
          - type: "weather"
            impact_on_traffic: true
          - type: "social_media"
            sentiment_analysis: true

    # Feedback Loop
    feedback:
      enabled: true
      accuracy_threshold: 0.8
      retrain_interval: 7d
      model_retention: 30d

---
# Predictive Scaling Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-scaler
  namespace: dmlog
  labels:
    app: dmlog
    component: predictive-scaler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dmlog
      component: predictive-scaler
  template:
    metadata:
      labels:
        app: dmlog
        component: predictive-scaler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: dmlog-service-account
      containers:
      - name: predictive-scaler
        image: dmlog/predictive-scaler:latest
        ports:
        - containerPort: 8080
          name: metrics
        env:
        - name: CONFIG_PATH
          value: "/etc/config/config.yaml"
        - name: PROMETHEUS_URL
          value: "http://prometheus-service.monitoring.svc.cluster.local:9090"
        - name: K8S_CONFIG_PATH
          value: "/etc/kubeconfig"
        - name: LOG_LEVEL
          value: "info"
        volumeMounts:
        - name: config
          mountPath: /etc/config
        - name: kubeconfig
          mountPath: /etc/kubeconfig
          readOnly: true
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: predictive-scaling-config
      - name: kubeconfig
        secret:
          secretName: dmlog-kubeconfig

---
# Predictive Scaling Service
apiVersion: v1
kind: Service
metadata:
  name: predictive-scaler-service
  namespace: dmlog
  labels:
    app: dmlog
    component: predictive-scaler
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: dmlog
    component: predictive-scaler
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: grpc
    port: 9090
    targetPort: 9090
    protocol: TCP

---
# Vertical Pod Autoscaler for ML Model Training
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: predictive-scaler-vpa
  namespace: dmlog
  labels:
    app: dmlog
    component: predictive-scaler
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: predictive-scaler
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: predictive-scaler
      minAllowed:
        cpu: 100m
        memory: 128Mi
      maxAllowed:
        cpu: 2
        memory: 4Gi
      controlledResources: ["cpu", "memory"]

---
# Custom Resource Definition for Scaling Policies
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scalingpolicies.dmlog.io
spec:
  group: dmlog.io
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              targetDeployment:
                type: string
              predictionModel:
                type: string
              scalingThresholds:
                type: object
                properties:
                  scaleUpThreshold:
                    type: number
                  scaleDownThreshold:
                    type: number
              scalingFactors:
                type: object
                properties:
                  scaleUpFactor:
                    type: number
                  scaleDownFactor:
                    type: number
              predictionHorizon:
                type: string
  scope: Namespaced
  names:
    plural: scalingpolicies
    singular: scalingpolicy
    kind: ScalingPolicy

---
# Example Scaling Policy
apiVersion: dmlog.io/v1
kind: ScalingPolicy
metadata:
  name: backend-scaling-policy
  namespace: dmlog
  labels:
    app: dmlog
    component: backend
spec:
  targetDeployment: backend-deployment
  predictionModel: "lstm"
  scalingThresholds:
    scaleUpThreshold: 0.8
    scaleDownThreshold: 0.3
  scalingFactors:
    scaleUpFactor: 1.5
    scaleDownFactor: 0.8
  predictionHorizon: "2h"