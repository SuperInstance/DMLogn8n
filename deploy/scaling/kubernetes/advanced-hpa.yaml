---
# Advanced Horizontal Pod Autoscalers with Custom Metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-advanced-hpa
  namespace: dmlog
  labels:
    app: dmlog
    component: backend
    scaling: advanced
  annotations:
    autoscaling.alpha.kubernetes.io/metrics: '[{"type":"External","external":{"metric":{"name":"prometheus_http_requests_per_second","selector":{"matchLabels":{"service":"backend"}}},"target":{"type":"AverageValue","averageValue":"500"}}}]'
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  minReplicas: 3
  maxReplicas: 50
  metrics:
  # Resource metrics
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75

  # Custom application metrics
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "800"

  - type: Pods
    pods:
      metric:
        name: response_time_p95
      target:
        type: AverageValue
        averageValue: "200ms"

  - type: Pods
    pods:
      metric:
        name: error_rate
      target:
        type: AverageValue
        averageValue: "0.01"

  # External metrics
  - type: External
    external:
      metric:
        name: queue_length
      target:
        type: AverageValue
        averageValue: "100"

  - type: External
    external:
      metric:
        name: database_connections_active
      target:
        type: AverageValue
        averageValue: "80"

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 5
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 200
        periodSeconds: 15
      - type: Pods
        value: 10
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 3
      selectPolicy: Max

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-advanced-hpa
  namespace: dmlog
  labels:
    app: dmlog
    component: frontend
    scaling: advanced
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-deployment
  minReplicas: 2
  maxReplicas: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  - type: Pods
    pods:
      metric:
        name: websocket_connections
      target:
        type: AverageValue
        averageValue: "1000"

  - type: Pods
    pods:
      metric:
        name: page_load_time_p95
      target:
        type: AverageValue
        averageValue: "1500ms"

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 5
        periodSeconds: 120
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 5
        periodSeconds: 30
      selectPolicy: Max

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: redis-cluster-hpa
  namespace: dmlog
  labels:
    app: dmlog
    component: redis
    scaling: advanced
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: redis
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  - type: Pods
    pods:
      metric:
        name: redis_connected_clients
      target:
        type: AverageValue
        averageValue: "100"

  - type: Pods
    pods:
      metric:
        name: redis_memory_usage_ratio
      target:
        type: AverageValue
        averageValue: "0.75"

  - type: Pods
    pods:
      metric:
        name: redis_commands_per_sec
      target:
        type: AverageValue
        averageValue: "10000"

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 10
        periodSeconds: 180
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      selectPolicy: Max

---
# Custom Metrics Service Monitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dmlog-metrics
  namespace: dmlog
  labels:
    app: dmlog
    component: metrics
spec:
  selector:
    matchLabels:
      app: dmlog
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    honorLabels: true

---
# Prometheus Rule for Custom Metrics
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dmlog-scaling-rules
  namespace: dmlog
  labels:
    app: dmlog
    component: monitoring
spec:
  groups:
  - name: scaling.rules
    rules:
    - record: dmlog:backend:http_requests_per_second:avg5m
      expr: rate(http_requests_total{service="backend"}[5m])

    - record: dmlog:backend:response_time_p95:5m
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{service="backend"}[5m]))

    - record: dmlog:backend:error_rate:5m
      expr: rate(http_requests_total{service="backend",status=~"5.."}[5m]) / rate(http_requests_total{service="backend"}[5m])

    - record: dmlog:redis:connected_clients:avg5m
      expr: redis_connected_clients

    - record: dmlog:redis:memory_usage_ratio:5m
      expr: redis_memory_used_bytes / redis_memory_max_bytes