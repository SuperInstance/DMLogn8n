# Pod Security Standards for DMLog
# Replaces deprecated Pod Security Policies with Pod Security Standards

apiVersion: v1
kind: Namespace
metadata:
  name: dmlog
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: dmlog-monitoring
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: dmlog-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Restricted Pod Security Standard Profile
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: dmlog-restricted-v2
  labels:
    app: dmlog
    security: restricted
    version: v2
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  allowedHostPaths: []
  hostNetwork: false
  hostIPC: false
  hostPID: false
---
# Baseline Pod Security Standard Profile
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: dmlog-baseline
  labels:
    app: dmlog
    security: baseline
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - NET_RAW
    - SYS_ADMIN
    - SYS_PTRACE
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
    - 'hostPath'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: false
  hostNetwork: false
  hostIPC: false
  hostPID: false
---
# Pod Security Admission Controller Configuration
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
- name: PodSecurity
  configuration:
    apiVersion: pod-security.admission.config.k8s.io/v1
    kind: PodSecurityConfiguration
    defaults:
      enforce: "baseline"
      audit: "restricted"
      warn: "restricted"
    exemptions:
      usernames: []
      runtimeClasses: []
      namespaces:
        - kube-system
        - dmlog-system
---
# Security Context Constraints for Application Pods
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-context-constraints
  namespace: dmlog
data:
  restricted-scc.yaml: |
    allowHostDirVolumePlugin: false
    allowHostIPC: false
    allowHostNetwork: false
    allowHostPID: false
    allowHostPorts: false
    allowPrivilegeEscalation: false
    allowPrivilegedContainer: false
    allowedCapabilities: []
    allowedFlexVolumes: []
    allowedUnsafeSysctls: []
    defaultAddCapabilities: []
    defaultRunAsUser: "RunAsAny"
    fsGroup:
      type: "MustRunAs"
      ranges:
      - min: 1000
        max: 1000
    groups: []
    priority: null
    readOnlyRootFilesystem: true
    requiredDropCapabilities:
    - ALL
    runAsUser:
      type: "MustRunAsNonRoot"
      uid: 1000
    seLinuxContext:
      type: "MustRunAs"
    seccompProfiles:
    - runtime/default
    supplementalGroups:
      type: "MustRunAs"
      ranges:
      - min: 1000
        max: 1000
    users: []
    volumes:
    - configMap
    - downwardAPI
    - emptyDir
    - persistentVolumeClaim
    - projected
    - secret