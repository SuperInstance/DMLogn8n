# Enhanced RBAC and Service Accounts for DMLog
# Implements principle of least privilege with granular permissions

---
# Main Application Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dmlog-app
  namespace: dmlog
  labels:
    app: dmlog
    component: application
  annotations:
    iam.amazonaws.com/role: arn:aws:iam::ACCOUNT_ID:role/dmlog-app-role
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/dmlog-app-role
---
# Backend Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dmlog-backend
  namespace: dmlog
  labels:
    app: dmlog
    component: backend
  annotations:
    iam.amazonaws.com/role: arn:aws:iam::ACCOUNT_ID:role/dmlog-backend-role
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/dmlog-backend-role
---
# Frontend Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dmlog-frontend
  namespace: dmlog
  labels:
    app: dmlog
    component: frontend
---
# Database Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dmlog-database
  namespace: dmlog
  labels:
    app: dmlog
    component: database
  annotations:
    iam.amazonaws.com/role: arn:aws:iam::ACCOUNT_ID:role/dmlog-database-role
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/dmlog-database-role
---
# Redis Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dmlog-redis
  namespace: dmlog
  labels:
    app: dmlog
    component: cache
---
# Monitoring Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dmlog-monitoring
  namespace: monitoring
  labels:
    app: dmlog
    component: monitoring
  annotations:
    iam.amazonaws.com/role: arn:aws:iam::ACCOUNT_ID:role/dmlog-monitoring-role
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/dmlog-monitoring-role
---
# Security Scanner Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dmlog-security-scanner
  namespace: dmlog
  labels:
    app: dmlog
    component: security
  annotations:
    iam.amazonaws.com/role: arn:aws:iam::ACCOUNT_ID:role/dmlog-security-scanner-role
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/dmlog-security-scanner-role
---
# Backup Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dmlog-backup
  namespace: dmlog
  labels:
    app: dmlog
    component: backup
  annotations:
    iam.amazonaws.com/role: arn:aws:iam::ACCOUNT_ID:role/dmlog-backup-role
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/dmlog-backup-role
---
# Application RBAC Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dmlog-app-role
  namespace: dmlog
  labels:
    app: dmlog
    component: application
rules:
# Read-only access to application config
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
  resourceNames:
  - dmlog-config
  - dmlog-secrets
  - database-credentials
  - redis-credentials

# Read access to application pods and services
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]

# Read access to events for troubleshooting
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]

# Read access to deployments
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]

# Read access to custom metrics
- apiGroups: ["metrics.k8s.io", "custom.metrics.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list"]
---
# Backend Application RBAC Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dmlog-backend-role
  namespace: dmlog
  labels:
    app: dmlog
    component: backend
rules:
# Full access to backend config and secrets
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
  resourceNames:
  - backend-config
  - backend-secrets
  - database-credentials
  - redis-credentials
  - jwt-secrets

# Create and update config for feature flags
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "update", "patch"]
  resourceNames:
  - feature-flags

# Read access to pods for service discovery
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]

# Access to custom metrics for autoscaling
- apiGroups: ["metrics.k8s.io", "custom.metrics.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list"]
---
# Database RBAC Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dmlog-database-role
  namespace: dmlog
  labels:
    app: dmlog
    component: database
rules:
# Access to database secrets
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
  resourceNames:
  - database-credentials
  - database-ca-certificate
  - database-backup-credentials

# Access to PVCs for storage management
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]

# Access to backup jobs
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
---
# Monitoring RBAC Role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dmlog-monitoring-role
  labels:
    app: dmlog
    component: monitoring
rules:
# Full access to metrics collection
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "nodes"]
  verbs: ["get", "list", "watch"]

# Access to metrics APIs
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]

# Access to custom metrics
- apiGroups: ["custom.metrics.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list"]

# Read access to all resources for monitoring
- apiGroups: ["apps", "extensions", "batch"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]

# Access to events
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
---
# Security Scanner RBAC Role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dmlog-security-scanner-role
  labels:
    app: dmlog
    component: security
rules:
# Read access to all pods for scanning
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

# Read access to nodes for CIS scans
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "label", "update"]

# Access to create scan jobs
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["create", "get", "list", "watch", "update", "patch"]

# Access to daemonsets for runtime security
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["get", "list", "watch"]

# Access to security policies
- apiGroups: ["policy"]
  resources: ["podsecuritypolicies"]
  verbs: ["get", "list", "watch"]

# Access to network policies
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
---
# Backup RBAC Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dmlog-backup-role
  namespace: dmlog
  labels:
    app: dmlog
    component: backup
rules:
# Access to backup secrets
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
  resourceNames:
  - database-backup-credentials
  - s3-backup-credentials

# Access to PVCs for backup operations
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]

# Create and manage backup jobs
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

# Read access to database pods
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
  resourceNames:
  - dmlog-database-*
---
# Role Bindings
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dmlog-app-binding
  namespace: dmlog
  labels:
    app: dmlog
    component: application
subjects:
- kind: ServiceAccount
  name: dmlog-app
  namespace: dmlog
roleRef:
  kind: Role
  name: dmlog-app-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dmlog-backend-binding
  namespace: dmlog
  labels:
    app: dmlog
    component: backend
subjects:
- kind: ServiceAccount
  name: dmlog-backend
  namespace: dmlog
roleRef:
  kind: Role
  name: dmlog-backend-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dmlog-database-binding
  namespace: dmlog
  labels:
    app: dmlog
    component: database
subjects:
- kind: ServiceAccount
  name: dmlog-database
  namespace: dmlog
roleRef:
  kind: Role
  name: dmlog-database-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dmlog-backup-binding
  namespace: dmlog
  labels:
    app: dmlog
    component: backup
subjects:
- kind: ServiceAccount
  name: dmlog-backup
  namespace: dmlog
roleRef:
  kind: Role
  name: dmlog-backup-role
  apiGroup: rbac.authorization.k8s.io
---
# Cluster Role Bindings
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dmlog-monitoring-binding
  labels:
    app: dmlog
    component: monitoring
subjects:
- kind: ServiceAccount
  name: dmlog-monitoring
  namespace: monitoring
roleRef:
  kind: ClusterRole
  name: dmlog-monitoring-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dmlog-security-scanner-binding
  labels:
    app: dmlog
    component: security
subjects:
- kind: ServiceAccount
  name: dmlog-security-scanner
  namespace: dmlog
roleRef:
  kind: ClusterRole
  name: dmlog-security-scanner-role
  apiGroup: rbac.authorization.k8s.io
---
# Service Account Token Management
apiVersion: v1
kind: Secret
metadata:
  name: dmlog-app-token
  namespace: dmlog
  annotations:
    kubernetes.io/service-account.name: dmlog-app
type: kubernetes.io/service-account-token
---
# PodSecurityPolicy Admission Controller
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: dmlog-restricted-psp
  labels:
    app: dmlog
    security: restricted
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: psp-user
  namespace: dmlog
rules:
- apiGroups: ['policy']
  resources: ['podsecuritypolicies']
  verbs: ['use']
  resourceNames:
  - dmlog-restricted-psp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dmlog-psp-binding
  namespace: dmlog
roleRef:
  kind: Role
  name: psp-user
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: dmlog-app
  namespace: dmlog
- kind: ServiceAccount
  name: dmlog-backend
  namespace: dmlog
- kind: ServiceAccount
  name: dmlog-frontend
  namespace: dmlog
- kind: ServiceAccount
  name: dmlog-database
  namespace: dmlog
- kind: ServiceAccount
  name: dmlog-redis
  namespace: dmlog