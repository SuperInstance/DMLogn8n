# External Secrets Operator Examples for DMLog
# Defines how to sync AWS Secrets Manager secrets with Kubernetes secrets

---
# Database Credentials External Secret
apiVersion: external-secrets.io/v1beta1
kind: Secret
metadata:
  name: database-credentials
  namespace: dmlog
  labels:
    app: dmlog
    component: database
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: database-credentials
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        engine: "{{ .engine }}"
        host: "{{ .host }}"
        port: "{{ .port }}"
        dbname: "{{ .dbname }}"
        database_url: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}"
  dataFrom:
  - extract:
      key: database/credentials
---
# Redis Credentials External Secret
apiVersion: external-secrets.io/v1beta1
kind: Secret
metadata:
  name: redis-credentials
  namespace: dmlog
  labels:
    app: dmlog
    component: cache
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: redis-credentials
    template:
      type: Opaque
      data:
        password: "{{ .password }}"
        host: "{{ .host }}"
        port: "{{ .port }}"
        db: "{{ .db }}"
        redis_url: "redis://:{{ .password }}@{{ .host }}:{{ .port }}/{{ .db }}"
  dataFrom:
  - extract:
      key: redis/credentials
---
# JWT Secret External Secret
apiVersion: external-secrets.io/v1beta1
kind: Secret
metadata:
  name: jwt-secret
  namespace: dmlog
  labels:
    app: dmlog
    component: auth
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: jwt-secret
    template:
      type: Opaque
      data:
        jwt-secret: "{{ .secret }}"
        jwt-algorithm: "{{ .algorithm }}"
  dataFrom:
  - extract:
      key: jwt/secret
---
# API Keys External Secret
apiVersion: external-secrets.io/v1beta1
kind: Secret
metadata:
  name: api-keys
  namespace: dmlog
  labels:
    app: dmlog
    component: integrations
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: api-keys
    template:
      type: Opaque
      data:
        stripe-secret-key: "{{ .stripe_secret_key }}"
        sendgrid-api-key: "{{ .sendgrid_api_key }}"
        twilio-auth-token: "{{ .twilio_auth_token }}"
        google-client-id: "{{ .google_client_id }}"
        google-secret: "{{ .google_secret }}"
  dataFrom:
  - extract:
      key: api/keys
---
# Backup Credentials External Secret
apiVersion: external-secrets.io/v1beta1
kind: Secret
metadata:
  name: backup-credentials
  namespace: dmlog
  labels:
    app: dmlog
    component: backup
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: backup-credentials
    template:
      type: Opaque
      data:
        aws-access-key-id: "{{ .access_key_id }}"
        aws-secret-access-key: "{{ .secret_key }}"
        backup-bucket: "{{ .bucket }}"
        backup-region: "{{ .region }}"
  dataFrom:
  - extract:
      key: backup/credentials
---
# SSL Certificates External Secret
apiVersion: external-secrets.io/v1beta1
kind: Secret
metadata:
  name: ssl-certificates
  namespace: dmlog
  labels:
    app: dmlog
    component: ssl
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: ssl-certificates
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .tls_crt }}"
        tls.key: "{{ .tls_key }}"
        ca.crt: "{{ .ca_crt }}"
  dataFrom:
  - extract:
      key: ssl/certificates
---
# Monitoring Secrets External Secret (for monitoring namespace)
apiVersion: external-secrets.io/v1beta1
kind: Secret
metadata:
  name: monitoring-secrets
  namespace: monitoring
  labels:
    app: dmlog
    component: monitoring
spec:
  secretStoreRef:
    name: aws-cluster-secrets-store
    kind: ClusterSecretStore
  target:
    name: monitoring-secrets
    template:
      type: Opaque
      data:
        slack-webhook-url: "{{ .slack_webhook_url }}"
        pagerduty-service-key: "{{ .pagerduty_service_key }}"
  dataFrom:
  - extract:
      key: monitoring/alerts
---
# PushSecret for automatic secret synchronization
apiVersion: external-secrets.io/v1beta1
kind: PushSecret
metadata:
  name: database-credentials-push
  namespace: dmlog
spec:
  secretStoreRefs:
  - name: aws-secrets-store
    kind: SecretStore
  selector:
    secret:
      name: database-credentials-temp
  refreshInterval: 1h
  data:
  - match:
      secretKey: new-password
      remoteRef:
        key: database/credentials
        property: password
  - match:
      secretKey: new-username
      remoteRef:
        key: database/credentials
        property: username
---
# Example of using ExternalSecret with specific JSON keys
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: dmlog
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # Example of transforming secret data
        app-database-url: "postgresql://{{ .database_username }}:{{ .database_password }}@{{ .database_host }}:{{ .database_port }}/{{ .database_name }}"
        app-redis-url: "redis://:{{ .redis_password }}@{{ .redis_host }}:{{ .redis_port }}/{{ .redis_db }}"
        app-jwt-secret: "{{ .jwt_secret }}"
  dataFrom:
  - sourceRef:
      storeRef:
        name: aws-secrets-store
        kind: SecretStore
    extract:
      # Extract specific keys from a JSON secret
      key: application/secrets
      conversionStrategy: Default
      decodingStrategy: None
    # Optional: select specific JSON properties
    propertyMapping:
      database_username: ".database.username"
      database_password: ".database.password"
      database_host: ".database.host"
      database_port: ".database.port"
      database_name: ".database.name"
      redis_password: ".redis.password"
      redis_host: ".redis.host"
      redis_port: ".redis.port"
      redis_db: ".redis.db"
      jwt_secret: ".jwt.secret"
---
# SecretStore with session authentication (alternative)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-store-session
  namespace: dmlog
spec:
  provider:
    aws:
      service: "SecretsManager"
      region: "us-west-2"
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-creds
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-creds
            key: secret-access-key
---
# ClusterExternalSecret for global secrets
apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret
metadata:
  name: global-app-secrets
spec:
  secretStoreRef:
    name: aws-cluster-secrets-store
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      data:
        global-app-key: "{{ .app_key }}"
        global-app-secret: "{{ .app_secret }}"
  dataFrom:
  - extract:
      key: global/secrets
  namespaceSelectors:
    - matchLabels:
      environment: production
    - matchLabels:
      environment: staging
---
# Example with secret validation
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: validated-secrets
  namespace: dmlog
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: validated-secrets
    template:
      type: Opaque
      data:
        validated-key: "{{ .secret_value }}"
  dataFrom:
  - sourceRef:
      storeRef:
        name: aws-secrets-store
        kind: SecretStore
    extract:
      key: validated/secrets
  refreshInterval: "1h"
  # Optional: validation
  validationPolicy:
    # Validate secret before updating
    validate: true
    # Minimum interval between validations
    validationInterval: "10m"