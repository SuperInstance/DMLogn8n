apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dmlog.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dmlog.labels" . | nindent 4 }}
    component: backend
data:
  APP_NAME: {{ .Values.config.app.name }}
  APP_VERSION: {{ .Values.config.app.version | quote }}
  ENVIRONMENT: {{ .Values.config.app.environment }}
  DEBUG: {{ .Values.config.app.debug | quote }}
  LOG_LEVEL: {{ .Values.config.app.logLevel }}
  CORS_ORIGINS: {{ join "," .Values.config.cors.origins }}
  MAX_CONNECTIONS: {{ .Values.config.performance.maxConnections | quote }}
  CONNECTION_TIMEOUT: {{ .Values.config.performance.connectionTimeout | quote }}
  WORKERS: {{ .Values.config.performance.workers | quote }}
  WORKER_CONNECTIONS: {{ .Values.config.performance.workerConnections | quote }}
  {{- if .Values.postgresql.enabled }}
  DATABASE_HOST: {{ include "dmlog.postgresql.fullname" . }}
  DATABASE_PORT: {{ .Values.postgresql.primary.service.ports.postgresql | quote }}
  DATABASE_NAME: {{ .Values.postgresql.auth.database }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_HOST: {{ include "dmlog.redis.fullname" . }}-master
  REDIS_PORT: {{ .Values.redis.master.service.ports.redis | quote }}
  {{- end }}
  {{- if .Values.config.extraConfig }}
  {{- toYaml .Values.config.extraConfig | nindent 2 }}
  {{- end }}