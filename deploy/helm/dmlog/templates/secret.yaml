{{- if include "dmlog.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dmlog.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dmlog.labels" . | nindent 4 }}
    component: backend
type: Opaque
data:
  {{- if not .Values.secrets.existingSecret }}
  DATABASE_URL: {{ include "dmlog.databaseURL" . | b64enc }}
  {{- if .Values.redis.auth.enabled }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | b64enc }}
  {{- end }}
  SECRET_KEY: {{ .Values.secrets.secretKey | default (randAlphaNum 32) | b64enc }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | default "" | b64enc }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | default "" | b64enc }}
  QDRANT_API_KEY: {{ .Values.secrets.qdrantApiKey | default "" | b64enc }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default (randAlphaNum 32) | b64enc }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | default (randAlphaNum 32) | b64enc }}
  {{- end }}
  {{- with .Values.secrets.extraData }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}