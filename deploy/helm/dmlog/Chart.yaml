apiVersion: v2
name: dmlog
description: A Helm chart for DMLog application deployment
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/dmlog/dmlog
sources:
  - https://github.com/dmlog/dmlog
maintainers:
  - name: DMLog Team
    email: team@dmlog.com
keywords:
  - dmlog
  - logging
  - monitoring
  - fastapi
  - react
annotations:
  category: Application
  licenses: MIT
dependencies:
  - name: postgresql
    version: 12.1.9
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.3.7
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: ingress-nginx
    version: 4.7.1
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled