apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-lb-config
  namespace: dmlog
  labels:
    app: nginx-lb
data:
  nginx.conf: |
    # Nginx Load Balancer Configuration for DMLog
    user nginx;
    worker_processes auto;
    worker_rlimit_nofile 65535;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 65535;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Logging format
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

        log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" "$http_x_forwarded_for" '
                           'rt=$request_time uct="$upstream_connect_time" '
                           'uht="$upstream_header_time" urt="$upstream_response_time" '
                           'cache=$upstream_cache_status '
                           'upstream_addr=$upstream_addr '
                           'upstream_status=$upstream_status';

        access_log /var/log/nginx/access.log detailed;

        # Performance optimizations
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        keepalive_requests 1000;
        types_hash_max_size 2048;
        server_tokens off;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_proxied any;
        gzip_types
            application/atom+xml
            application/geo+json
            application/javascript
            application/x-javascript
            application/json
            application/ld+json
            application/manifest+json
            application/rdf+xml
            application/rss+xml
            application/xhtml+xml
            application/xml
            font/eot
            font/otf
            font/ttf
            image/svg+xml
            text/css
            text/javascript
            text/plain
            text/xml;

        # Brotli compression (if enabled)
        # brotli on;
        # brotli_comp_level 6;
        # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
        limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
        limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/m;
        limit_req_zone $binary_remote_addr zone=search_limit:10m rate=20r/s;

        # Connection limiting
        limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

        # Upstream backends
        upstream backend_servers {
            least_conn;
            server backend-service-1:8000 max_fails=3 fail_timeout=30s weight=1;
            server backend-service-2:8000 max_fails=3 fail_timeout=30s weight=1;
            server backend-service-3:8000 max_fails=3 fail_timeout=30s weight=1;
            keepalive 32;
        }

        upstream static_servers {
            least_conn;
            server static-service-1:80 max_fails=3 fail_timeout=30s;
            server static-service-2:80 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        # Proxy cache
        proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g
                         inactive=60m use_temp_path=off;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # HTTP server (redirect to HTTPS)
        server {
            listen 80;
            server_name _;
            return 301 https://$host$request_uri;
        }

        # HTTPS main server
        server {
            listen 443 ssl http2;
            server_name api.dmlog.com;

            # SSL certificates
            ssl_certificate /etc/nginx/ssl/dmlog.crt;
            ssl_certificate_key /etc/nginx/ssl/dmlog.key;

            # Security headers
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.dmlog.com wss://api.dmlog.com;" always;

            # Connection limiting
            limit_conn conn_limit_per_ip 20;

            # API endpoints
            location /api/ {
                # Rate limiting
                limit_req zone=api_limit burst=50 nodelay;

                # Proxy settings
                proxy_pass http://backend_servers/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_cache_bypass $http_upgrade;

                # Timeouts
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;

                # Buffering
                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 4k;
            }

            # Login endpoint with stricter rate limiting
            location /api/auth/login {
                limit_req zone=login_limit burst=5 nodelay;

                proxy_pass http://backend_servers/auth/login;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }

            # File upload endpoint
            location /api/upload {
                limit_req zone=upload_limit burst=3 nodelay;

                client_max_body_size 100M;
                proxy_pass http://backend_servers/upload;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_connect_timeout 60s;
                proxy_send_timeout 300s;
                proxy_read_timeout 300s;
                proxy_request_buffering off;
            }

            # Search endpoint
            location /api/search {
                limit_req zone=search_limit burst=10 nodelay;

                # Enable caching for search results
                proxy_cache api_cache;
                proxy_cache_valid 200 5m;
                proxy_cache_key "$request_method$request_uri$is_args$args";
                proxy_cache_bypass $http_pragma $http_authorization;

                proxy_pass http://backend_servers/search;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }

            # Health check endpoint
            location /health {
                access_log off;
                proxy_pass http://backend_servers/health;
            }

            # Static files with caching
            location /static/ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options nosniff;

                proxy_pass http://static_servers/static/;
                proxy_cache api_cache;
                proxy_cache_valid 200 1y;
                proxy_cache_key "$request_uri";
            }
        }

        # Frontend server
        server {
            listen 443 ssl http2;
            server_name app.dmlog.com;

            # SSL certificates
            ssl_certificate /etc/nginx/ssl/dmlog.crt;
            ssl_certificate_key /etc/nginx/ssl/dmlog.key;

            # Security headers
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://api.dmlog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.dmlog.com wss://api.dmlog.com;" always;

            # Root directory
            root /usr/share/nginx/html;
            index index.html index.htm;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options nosniff;
                try_files $uri =404;
            }

            # HTML files - cache for shorter time
            location ~* \.html$ {
                expires 1h;
                add_header Cache-Control "public";
                try_files $uri =404;
            }

            # SPA fallback
            location / {
                try_files $uri $uri/ /index.html;
            }

            # Health check
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }

        # Status page for monitoring
        server {
            listen 8080;
            location /nginx_status {
                stub_status on;
                access_log off;
                allow 127.0.0.1;
                allow 10.0.0.0/8;
                deny all;
            }

            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-load-balancer
  namespace: dmlog
  labels:
    app: nginx-lb
    component: load-balancer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-lb
      component: load-balancer
  template:
    metadata:
      labels:
        app: nginx-lb
        component: load-balancer
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        - containerPort: 8080
          name: status
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: ssl-certs
          mountPath: /etc/nginx/ssl
          readOnly: true
        - name: cache-storage
          mountPath: /var/cache/nginx
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-lb-config
      - name: ssl-certs
        secret:
          secretName: dmlog-wildcard-tls
      - name: cache-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-load-balancer-service
  namespace: dmlog
  labels:
    app: nginx-lb
    component: load-balancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-west-2:123456789012:certificate/12345678-1234-1234-1234-123456789012"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    name: http
  - port: 443
    targetPort: 443
    name: https
  selector:
    app: nginx-lb
    component: load-balancer