apiVersion: v1
kind: ConfigMap
metadata:
  name: dmlogn8n-config
  namespace: dmlogn8n
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  TZ: "UTC"
  CHARACTER_MODEL: "gpt-4"
  CHARACTER_TEMPERATURE: "0.7"
  CHARACTER_MAX_TOKENS: "1000"
  CORS_ORIGINS: "https://dmlogn8n.com"
  RATE_LIMIT: "100/hour"
  REACT_APP_API_URL: "https://api.dmlogn8n.com"
  REACT_APP_N8N_URL: "https://n8n.dmlogn8n.com"
  REACT_APP_WS_URL: "wss://api.dmlogn8n.com"
  REACT_APP_ENVIRONMENT: "production"
  REACT_APP_VERSION: "1.0.0"
  REACT_APP_FEATURES_CHARACTER_CODE: "true"
  REACT_APP_FEATURES_VOICE_CHAT: "true"
  REACT_APP_FEATURES_REAL_TIME_COMBAT: "true"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: dmlogn8n
data:
  my.cnf: |
    [mysqld]
    bind-address = 0.0.0.0
    port = 3306
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_ci
    init-connect = 'SET NAMES utf8mb4'
    innodb_buffer_pool_size = 2G
    innodb_log_file_size = 256M
    innodb_flush_log_at_trx_commit = 1
    innodb_flush_method = O_DIRECT
    max_connections = 200
    max_connect_errors = 1000
    connect_timeout = 60
    wait_timeout = 28800
    query_cache_type = 1
    query_cache_size = 256M
    query_cache_limit = 2M
    slow_query_log = 1
    long_query_time = 2
    log_bin = /var/log/mysql/mysql-bin.log
    expire_logs_days = 7
    max_binlog_size = 100M

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: dmlogn8n
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode yes
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    save 60 10000
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    loglevel notice
    rename-command FLUSHDB ""
    rename-command FLUSHALL ""
    rename-command KEYS ""
    rename-command CONFIG "CONFIG_b835c3f8a2d6e7f1"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: dmlogn8n
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        include /etc/nginx/conf.d/*.conf;
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: dmlogn8n
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    rule_files:
      - "/etc/prometheus/alert_rules.yml"

    scrape_configs:
      - job_name: 'dmlogn8n-api'
        static_configs:
          - targets: ['api:8000']
        metrics_path: '/metrics'
        scrape_interval: 30s

      - job_name: 'dmlogn8n-character-coder'
        static_configs:
          - targets: ['character-coder:3001']
        metrics_path: '/metrics'
        scrape_interval: 30s

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']
        scrape_interval: 30s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093

  alert_rules.yml: |
    groups:
      - name: dmlogn8n_alerts
        rules:
          - alert: HighCPUUsage
            expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "CPU usage is above 80% for more than 5 minutes"

          - alert: HighMemoryUsage
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected"
              description: "Memory usage is above 85% for more than 5 minutes"

          - alert: DiskSpaceUsage
            expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 90
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Disk space usage critical"
              description: "Disk usage is above 90%"