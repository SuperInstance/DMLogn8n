apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dmlog-ingress
  namespace: dmlog
  labels:
    app: dmlog
    component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.dmlog.com wss://api.dmlog.com;" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Large request body support
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.dmlog.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With"
spec:
  tls:
  - hosts:
    - app.dmlog.com
    - api.dmlog.com
    secretName: dmlog-tls-certificate
  rules:
  - host: "app.dmlog.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
  - host: "api.dmlog.com"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dmlog-network-policy
  namespace: dmlog
  labels:
    app: dmlog
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8000
  # Allow traffic between dmlog components
  - from:
    - podSelector:
        matchLabels:
          app: dmlog
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 8000  # Backend API
    - protocol: TCP
      port: 80    # Frontend
  # Allow monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          name: dmlog-monitoring
    ports:
    - protocol: TCP
      port: 9090  # Backend metrics
    - protocol: TCP
      port: 9113  # Nginx metrics
    - protocol: TCP
      port: 9187  # PostgreSQL metrics
    - protocol: TCP
      port: 9121  # Redis metrics
  # Allow logging
  - from:
    - namespaceSelector:
        matchLabels:
          name: dmlog-logging
    ports:
    - protocol: TCP
      port: 514    # Syslog
    - protocol: UDP
      port: 514    # Syslog
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow external API calls
  - to: []
    ports:
    - protocol: TCP
      port: 443   # HTTPS
    - protocol: TCP
      port: 80    # HTTP
  # Allow communication within namespace
  - to:
    - podSelector:
        matchLabels:
          app: dmlog