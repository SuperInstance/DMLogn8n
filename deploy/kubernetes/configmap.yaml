apiVersion: v1
kind: ConfigMap
metadata:
  name: dmlog-config
  namespace: dmlog
  labels:
    app: dmlog
    component: backend
data:
  APP_NAME: "DMLog API"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  REDIS_URL: "redis://redis-service:6379/0"
  QDRANT_URL: "http://qdrant-service:6333"
  CORS_ORIGINS: "https://app.dmlog.com,https://api.dmlog.com"
  MAX_CONNECTIONS: "100"
  CONNECTION_TIMEOUT: "30"
  # Database configuration (will use secrets for credentials)
  DATABASE_HOST: "postgresql-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "dmlog_prod"
  # Performance settings
  WORKERS: "4"
  WORKER_CONNECTIONS: "1000"
  MAX_REQUESTS: "1000"
  MAX_REQUESTS_JITTER: "100"
  # Monitoring
  ENABLE_METRICS: "true"
  METRICS_PORT: "9090"
  # Health check
  HEALTH_CHECK_INTERVAL: "30"
  # Cache settings
  CACHE_TTL: "3600"
  CACHE_MAX_SIZE: "1000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: dmlog
  labels:
    app: dmlog
    component: frontend
data:
  nginx.conf: |
    upstream backend {
        server backend-service:8000;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.dmlog.com;" always;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

        # Frontend static files
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # API proxy
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Login endpoint with stricter rate limiting
        location /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }
    }