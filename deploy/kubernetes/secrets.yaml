apiVersion: v1
kind: Secret
metadata:
  name: dmlog-secrets
  namespace: dmlog
  labels:
    app: dmlog
    component: backend
type: Opaque
data:
  # These should be base64 encoded values
  # In production, use external secret management like AWS Secrets Manager or HashiCorp Vault
  DATABASE_URL: <BASE64_ENCODED_DATABASE_URL>
  REDIS_PASSWORD: <BASE64_ENCODED_REDIS_PASSWORD>
  SECRET_KEY: <BASE64_ENCODED_SECRET_KEY>
  OPENAI_API_KEY: <BASE64_ENCODED_OPENAI_API_KEY>
  ANTHROPIC_API_KEY: <BASE64_ENCODED_ANTHROPIC_API_KEY>
  QDRANT_API_KEY: <BASE64_ENCODED_QDRANT_API_KEY>
  JWT_SECRET: <BASE64_ENCODED_JWT_SECRET>
  ENCRYPTION_KEY: <BASE64_ENCODED_ENCRYPTION_KEY>
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: dmlog
  labels:
    app: dmlog
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <BASE64_ENCODED_DOCKER_CONFIG>
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-certificate
  namespace: dmlog
  labels:
    app: dmlog
    component: frontend
type: kubernetes.io/tls
data:
  tls.crt: <BASE64_ENCODED_TLS_CERTIFICATE>
  tls.key: <BASE64_ENCODED_TLS_PRIVATE_KEY>