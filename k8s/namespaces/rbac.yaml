# Service Accounts
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dmlogn8n-app-sa
  namespace: dmlogn8n
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dmlogn8n-monitoring-sa
  namespace: dmlogn8n-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dmlogn8n-logging-sa
  namespace: dmlogn8n-logging
---
# Roles
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dmlogn8n-app-role
  namespace: dmlogn8n
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dmlogn8n-monitoring-role
  namespace: dmlogn8n-monitoring
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dmlogn8n-monitoring-cluster-role
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods", "ingresses", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
# Role Bindings
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dmlogn8n-app-rolebinding
  namespace: dmlogn8n
subjects:
- kind: ServiceAccount
  name: dmlogn8n-app-sa
  namespace: dmlogn8n
roleRef:
  kind: Role
  name: dmlogn8n-app-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dmlogn8n-monitoring-rolebinding
  namespace: dmlogn8n-monitoring
subjects:
- kind: ServiceAccount
  name: dmlogn8n-monitoring-sa
  namespace: dmlogn8n-monitoring
roleRef:
  kind: Role
  name: dmlogn8n-monitoring-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dmlogn8n-monitoring-cluster-rolebinding
subjects:
- kind: ServiceAccount
  name: dmlogn8n-monitoring-sa
  namespace: dmlogn8n-monitoring
roleRef:
  kind: ClusterRole
  name: dmlogn8n-monitoring-cluster-role
  apiGroup: rbac.authorization.k8s.io