# BCI System Configuration File
# Advanced Brain-Computer Interface Configuration

# System Settings
system:
  name: "DMLogn8n Neural BCI System"
  version: "1.0.0"
  debug: false
  log_level: "INFO"
  max_concurrent_sessions: 10
  data_retention_days: 365

# Neural Interface Configuration
neural_interface:
  # Supported Platforms
  platforms:
    - name: "openbci"
      enabled: true
      sampling_rate: 250
      num_channels: 8
      board_type: "cyton"
      port: "/dev/ttyUSB0"

    - name: "emotiv"
      enabled: false
      sampling_rate: 128
      num_channels: 14
      client_id: ""
      client_secret: ""

    - name: "neurosky"
      enabled: false
      sampling_rate: 512
      num_channels: 1
      port: "/dev/tty.MindWave"

    - name: "simulator"
      enabled: true
      sampling_rate: 250
      num_channels: 8
      noise_level: 0.1

  # Signal Processing
  signal_processing:
    filter_bank:
      delta: [0.5, 4]
      theta: [4, 8]
      alpha: [8, 13]
      beta: [13, 30]
      gamma: [30, 100]
      high_gamma: [100, 200]

    notch_filter:
      frequency: 50  # Power line frequency
      quality_factor: 30

    quality_assessment:
      signal_to_noise_threshold: 3.0
      line_noise_threshold: 0.1
      artifact_threshold: 0.2
      connection_quality_threshold: 0.8

# Thought Detection Configuration
thought_detection:
  models:
    deep_neural_network:
      enabled: true
      model_path: "thought_models/"
      input_size: 256
      num_classes: 12
      confidence_threshold: 0.6

    ensemble_classifiers:
      enabled: true
      algorithms:
        - "random_forest"
        - "gradient_boosting"
        - "svm"

  categories:
    # Movement Commands
    - name: "move_forward"
      type: "command"
      confidence_threshold: 0.7
    - name: "move_backward"
      type: "command"
      confidence_threshold: 0.7
    - name: "jump"
      type: "command"
      confidence_threshold: 0.8
    - name: "interact"
      type: "command"
      confidence_threshold: 0.6

    # Cognitive States
    - name: "focus"
      type: "cognitive"
      confidence_threshold: 0.5
    - name: "relax"
      type: "cognitive"
      confidence_threshold: 0.5
    - name: "think"
      type: "cognitive"
      confidence_threshold: 0.4

    # Emotional States
    - name: "happy"
      type: "emotion"
      confidence_threshold: 0.6
    - name: "calm"
      type: "emotion"
      confidence_threshold: 0.5
    - name: "excited"
      type: "emotion"
      confidence_threshold: 0.7

# Motor Imagery Configuration
motor_imagery:
  csp_features:
    num_components: 4
    frequency_bands:
      - [8, 13]  # Alpha
      - [13, 30] # Beta
      - [4, 8]   # Theta

  actions:
    basic_movements:
      - "walk_forward"
      - "walk_backward"
      - "walk_left"
      - "walk_right"
      - "jump"
      - "crouch"

    upper_body:
      - "punch"
      - "grab"
      - "throw"
      - "wave"
      - "point"

    complex_actions:
      - "dance"
      - "climb"
      - "swim"
      - "fight_sequence"

  training:
    trials_per_action: 20
    trial_duration: 4.0  # seconds
    rest_duration: 2.0   # seconds
    calibration_duration: 60.0  # seconds

# Emotional BCI Configuration
emotional_bci:
  emotion_types:
    - "joy"
    - "sadness"
    - "anger"
    - "fear"
    - "surprise"
    - "disgust"
    - "neutral"
    - "excitement"
    - "calm"
    - "anxiety"

  dimensions:
    valence:
      range: [-1.0, 1.0]
      description: "Positive to negative"
    arousal:
      range: [-1.0, 1.0]
      description: "Calm to excited"
    dominance:
      range: [-1.0, 1.0]
      description: "Submissive to dominant"

  response_templates:
    joy:
      character_adjustments:
        animation: "bounce"
        voice_tone: "upbeat"
        movement_speed: "fast"
    sadness:
      character_adjustments:
        animation: "gentle"
        voice_tone: "soft"
        movement_speed: "slow"
    anger:
      character_adjustments:
        animation: "intense"
        voice_tone: "firm"
        movement_speed: "moderate"
    fear:
      character_adjustments:
        animation: "trembling"
        voice_tone: "worried"
        movement_speed: "slow"

# Memory BCI Configuration
memory_bci:
  memory_types:
    - "episodic"
    - "semantic"
    - "procedural"
    - "working"
    - "long_term"
    - "sensory"
    - "emotional"
    - "spatial"

  database:
    type: "sqlite"
    path: "memory_database.db"
    backup_interval: 3600  # seconds
    max_size_gb: 10

  consolidation:
    automatic: true
    interval_hours: 24
    threshold: 0.7

  retrieval:
    similarity_threshold: 0.7
    max_results: 10
    timeout_seconds: 30

# Collaborative BCI Configuration
collaborative_bci:
  networking:
    enabled: true
    port: 8765
    max_connections: 50
    protocol: "tcp"

  synchronization:
    levels:
      minimal: 0.1
      low: 0.3
      medium: 0.5
      high: 0.7
      deep: 0.9
      complete: 1.0

    connection_types:
      - "direct_sync"
      - "emotional_shared"
      - "cognitive_merge"
      - "sensory_exchange"
      - "memory_shared"
      - "intent_transmission"
      - "collective_consciousness"

  sessions:
    max_participants: 8
    default_duration: 3600  # seconds
    auto_cleanup: true
    cleanup_interval: 300   # seconds

# Security Configuration
security:
  encryption:
    enabled: true
    algorithm: "AES_256_GCM"
    key_rotation_interval: 86400  # seconds
    key_lifetime: 2592000         # seconds (30 days)

  access_control:
    session_timeout: 3600         # seconds
    max_login_attempts: 5
    lockout_duration: 900         # seconds
    require_2fa: false

  data_protection:
    anonymization: true
    data_minimization: true
    audit_logging: true

  compliance:
    standards:
      - "GDPR"
      - "HIPAA"
      - "CCPA"
    audit_frequency: 24  # hours

# Neuro-Feedback Configuration
neuro_feedback:
  visualization:
    backend: "plotly"
    update_interval: 100  # milliseconds
    window_size: 1000     # milliseconds

  feedback_types:
    - "brain_map"
    - "wave_form"
    - "spectrum"
    - "connectivity"
    - "performance"
    - "training"
    - "immersive"

  training:
    target_metrics:
      focus: 0.7
      relaxation: 0.6
      cognitive_load: 0.5

    session_duration: 1800  # seconds
    break_intervals: 300    # seconds

# Game Integration Configuration
game_integration:
  enabled: true
  api_endpoint: "ws://localhost:8080/bci"
  update_frequency: 60  # Hz

  controls:
    movement:
      forward_threshold: 0.6
      backward_threshold: 0.6
      left_threshold: 0.6
      right_threshold: 0.6
      jump_threshold: 0.8

    actions:
      interact_threshold: 0.7
      attack_threshold: 0.8
      defend_threshold: 0.7

    emotional_responses:
      enabled: true
      threshold: 0.6
      response_delay: 500  # milliseconds

# Hardware Configuration
hardware:
  processors:
    gpu:
      enabled: true
      device: "cuda:0"
      memory_fraction: 0.8

    cpu:
      max_workers: 4
      thread_pool_size: 8

  memory:
    max_ram_usage_gb: 8
    gc_interval: 300  # seconds

  storage:
    data_directory: "./bci_data"
    temp_directory: "./bci_temp"
    max_storage_gb: 50

# Performance Optimization
performance:
  caching:
    enabled: true
    size_mb: 100
    ttl_seconds: 3600

  batch_processing:
    enabled: true
    batch_size: 32
    max_queue_size: 1000

  optimization:
    model_quantization: false
    feature_selection: true
    dimensionality_reduction: true

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file:
    enabled: true
    path: "./logs/bci_system.log"
    max_size_mb: 100
    backup_count: 5

  console:
    enabled: true

  remote:
    enabled: false
    endpoint: ""
    api_key: ""

# Development and Testing
development:
  testing_mode: false
  mock_hardware: true
  save_test_data: false
  test_data_directory: "./test_data"

  debugging:
    enable_profiling: false
    memory_profiling: false
    performance_monitoring: false

# Experimental Features
experimental:
  quantum_neural_processing: false
  predictive_modeling: false
  adaptive_algorithms: true
  real_time_learning: false

  research_features:
    cross_brain_communication: false
    neural_enhancement: false
    consciousness_mapping: false

# API Configuration
api:
  enabled: true
  host: "localhost"
  port: 8000
  ssl_enabled: false
  rate_limiting:
    requests_per_minute: 100
    burst_size: 20

  authentication:
    enabled: true
    token_expiry: 3600
    refresh_token_expiry: 86400

# Monitoring and Metrics
monitoring:
  enabled: true
  metrics_interval: 60  # seconds
  health_check_interval: 300  # seconds

  alerts:
    enabled: true
    email_notifications: false
    slack_webhook: ""

  dashboards:
    enabled: true
    port: 3000
    update_interval: 5000  # milliseconds

# Backup and Recovery
backup:
  enabled: true
  interval: 86400  # seconds
  retention_days: 30
  compression: true
  encryption: true
  storage_location: "./backups"

  recovery:
    automatic: false
    max_recovery_attempts: 3
    verification_enabled: true

# Accessibility Features
accessibility:
  enabled: true
  visual_feedback: true
  audio_feedback: true
  haptic_feedback: false

  accommodations:
    motor_impairments: true
    visual_impairments: true
    cognitive_impairments: true

  ui_settings:
    high_contrast: false
    large_text: false
    reduced_motion: false