# Combat System A/B Testing Experiments Configuration
# DMLogn8n Multi-Agent Platform

experiments:
  # Experiment 1: Damage Calculation Variations
  exp_damage_calculation_variations:
    name: "Combat Damage Calculation Variations"
    description: "Test different damage calculation methods and combat mechanics"
    status: "draft"
    tags: ["combat", "mechanics", "damage", "balance"]

    hypothesis:
      primary_metric: "combat_satisfaction_score"
      expected_effect: "increase"
      expected_magnitude: 0.15
      confidence_level: 0.95

    variants:
      - id: "control_standard"
        name: "Standard Damage (Control)"
        description: "Traditional damage calculation with base formulas"
        traffic_percentage: 25.0
        is_control: true
        config:
          damage_formula: "base_damage * (1 + strength_mod) * weapon_multiplier"
          critical_hit_chance: 0.05
          critical_hit_multiplier: 2.0
          variance_factor: 0.1
          damage_reduction_type: "linear"
          dodge_chance: 0.1

      - id: "variant_enhanced_criticals"
        name: "Enhanced Critical System"
        description: "Improved critical hit system with multiple tiers"
        traffic_percentage: 25.0
        config:
          damage_formula: "base_damage * (1 + strength_mod) * weapon_multiplier"
          critical_hit_system: "tiered"
          critical_tiers:
            - tier: "normal_critical"
              chance: 0.05
              multiplier: 2.0
              visual_effect: "standard"
            - tier: "devastating_critical"
              chance: 0.01
              multiplier: 3.5
              visual_effect: "enhanced"
            - tier: "perfect_critical"
              chance: 0.001
              multiplier: 5.0
              visual_effect: "spectacular"
          variance_factor: 0.15
          critical_animation_overrides: true

      - id: "variant_adaptive_damage"
        name: "Adaptive Damage System"
        description: "Damage adapts based on player skill and enemy difficulty"
        traffic_percentage: 25.0
        config:
          damage_formula: "adaptive"
          base_damage: "standard"
          adaptation_factors:
            player_skill_rating: 0.3
            enemy_difficulty_rating: 0.2
            recent_performance: 0.2
            combat_streak: 0.1
            weapon_proficiency: 0.2
          adaptive_mechanics:
            dynamic_difficulty: true
            skill_based_scaling: true
            performance_tracking: true
            rubber_banding: "limited"

      - id: "variant_strategic_elements"
        name: "Strategic Combat Elements"
        description: "More strategic combat with positioning and timing elements"
        traffic_percentage: 25.0
        config:
          damage_formula: "strategic"
          base_damage: "standard"
          strategic_modifiers:
            positioning_bonus: true
            timing_multiplier: true
            combo_system: true
            environment_factors: true
            weapon_advantage_system: true
          strategic_elements:
            flanking_bonus: 1.25
            height_advantage: 1.15
            timing_perfect_multiplier: 1.3
            combo_scaling: 1.1
            elemental_interactions: true

    metrics:
      - id: "combat_satisfaction_score"
        name: "Combat Satisfaction Score"
        description: "User-rated satisfaction with combat mechanics (1-10)"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05
        minimum_effect_size: 0.10

      - id: "combat_completion_rate"
        name: "Combat Completion Rate"
        description: "Percentage of combats that players complete"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "z_test"
        significance_level: 0.05

      - id: "average_combat_duration"
        name: "Average Combat Duration"
        description: "Average time taken to complete combat encounters"
        metric_type: "engagement"
        target_value: "optimal"  # Not too long, not too short
        statistical_test: "t_test"
        significance_level: 0.05

      - id: "player_retention_after_combat"
        name: "Player Retention After Combat"
        description: "Player retention rate after engaging in combat"
        metric_type: "retention"
        target_value: "higher"
        statistical_test: "z_test"
        significance_level: 0.05

      - id: "difficulty_perception_rating"
        name: "Difficulty Perception Rating"
        description: "How players perceive combat difficulty (1-5)"
        metric_type: "engagement"
        target_value: "balanced"  # Around 3.0 for balanced difficulty
        statistical_test: "t_test"
        significance_level: 0.05

    traffic_allocation_type: "uniform"
    target_audience:
      all_users: false
      level_range: [5, 50]
      min_combat_sessions: 3
      exclude_new_players: true  # Players with less than 7 days

    sample_size_requirements:
      minimum_sample_size: 2000
      desired_power: 0.8

    duration:
      planned_days: 21

  # Experiment 2: Combat Flow and Pacing
  exp_combat_flow_pacing:
    name: "Combat Flow and Pacing Test"
    description: "Test different combat flow and pacing mechanics"
    status: "draft"
    tags: ["combat", "flow", "pacing", "user_experience"]

    hypothesis:
      primary_metric: "combat_flow_rating"
      expected_effect: "increase"
      expected_magnitude: 0.20
      confidence_level: 0.90

    variants:
      - id: "control_standard_pacing"
        name: "Standard Pacing (Control)"
        description: "Traditional turn-based combat pacing"
        traffic_percentage: 25.0
        is_control: true
        config:
          combat_system: "turn_based"
          turn_timer: 30
          action_queue_size: 1
          animation_speed: "normal"
          feedback_intensity: "standard"

      - id: "variant_dynamic_pacing"
        name: "Dynamic Pacing"
        description: "Pacing adapts based on combat intensity and situation"
        traffic_percentage: 25.0
        config:
          combat_system: "adaptive_turn"
          base_turn_timer: 25
          dynamic_timer_adjustment: true
          pacing_factors:
            combat_intensity: true
            health_percentage: true
            number_of_combatants: true
            environmental_hazards: true
          speed_modifiers:
            low_health_speed: 1.2
            high_intensity_speed: 0.8
            outnumbered_speed: 1.1
            environmental_advantage_speed: 0.9

      - id: "variant_quick_combat"
        name: "Quick Combat Mode"
        description: "Faster-paced combat with streamlined mechanics"
        traffic_percentage: 25.0
        config:
          combat_system: "quick_turn"
          turn_timer: 15
          auto_action_suggestions: true
          quick_action_modes:
            - "auto_basic_attack"
            - "smart_skill_usage"
            - "optimal_targeting"
          animation_speed: "fast"
          feedback_intensity: "minimal"

      - id: "variant_cinematic_combat"
        name: "Cinematic Combat"
        description: "More dramatic, cinematic combat presentation"
        traffic_percentage: 25.0
        config:
          combat_system: "cinematic_turn"
          turn_timer: 45
          dramatic_elements: true
          cinematic_features:
            slow_motion_criticals: true
            environmental_interactions: true
            dynamic_camera_angles: true
            dramatic_entrances: true
            victory_animations: true
          animation_speed: "variable"
          feedback_intensity: "high"

    metrics:
      - id: "combat_flow_rating"
        name: "Combat Flow Rating"
        description: "User rating of combat flow and pacing (1-10)"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

      - id: "turn_decision_time"
        name: "Turn Decision Time"
        description: "Average time players take to make combat decisions"
        metric_type: "engagement"
        target_value: "optimal"
        statistical_test: "mann_whitney"
        significance_level: 0.05

      - id: "action_satisfaction"
        name: "Action Satisfaction"
        description: "Satisfaction with available actions and choices"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

      - id: "combat_engagement_rate"
        name: "Combat Engagement Rate"
        description: "How actively engaged players are during combat"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

    traffic_allocation_type: "uniform"
    target_audience:
      all_users: false
      segments: ["combat_enthusiasts", "power_users"]
      min_combat_sessions: 5

    sample_size_requirements:
      minimum_sample_size: 1500
      desired_power: 0.8

    duration:
      planned_days: 14

  # Experiment 3: Combat Reward Systems
  exp_combat_reward_systems:
    name: "Combat Reward Systems Test"
    description: "Test different combat reward and progression systems"
    status: "draft"
    tags: ["combat", "rewards", "progression", "motivation"]

    hypothesis:
      primary_metric: "combat_motivation_score"
      expected_effect: "increase"
      expected_magnitude: 0.18
      confidence_level: 0.95

    variants:
      - id: "control_standard_rewards"
        name: "Standard Rewards (Control)"
        description: "Traditional experience points and loot drops"
        traffic_percentage: 25.0
        is_control: true
        config:
          reward_system: "standard"
          experience_rewards: "base_xp"
          loot_system: "random_drops"
          reward_frequency: "combat_end"
          progression_bonuses: false

      - id: "variant_performance_rewards"
        name: "Performance-Based Rewards"
        description: "Rewards based on combat performance and skill"
        traffic_percentage: 25.0
        config:
          reward_system: "performance_based"
          performance_metrics:
            damage_dealt: true
            damage_taken: true
            combat_duration: true
            skill_usage_efficiency: true
            tactical_decisions: true
          reward_modifiers:
            perfect_combat_bonus: 1.5
            no_damage_bonus: 1.3
            speed_completion_bonus: 1.2
            skill_variety_bonus: 1.1
          achievement_system: true

      - id: "variant_streak_rewards"
        name: "Combat Streak System"
        description: "Rewards for consecutive combat victories and streaks"
        traffic_percentage: 25.0
        config:
          reward_system: "streak_based"
          streak_tracking: true
          streak_multipliers:
            victory_streak_3: 1.2
            victory_streak_5: 1.5
            victory_streak_10: 2.0
            perfect_streak_5: 2.5
          streak_bonuses:
            bonus_loot_tiers: true
            temporary_buffs: true
            cosmetic_rewards: true
            leaderboards: true
          streak_decay: "gradual"

      - id: "variant_social_rewards"
        name: "Social Combat Rewards"
        description: "Rewards tied to social combat features and group play"
        traffic_percentage: 25.0
        config:
          reward_system: "social_based"
          social_features:
            combat_spectating: true
            combat_sharing: true
            group_combat_bonuses: true
            mentorship_rewards: true
            pvp_ranking_system: true
          social_rewards:
            spectator_bonuses: true
            shared_victories: true
            team_coordination_bonuses: true
            social_media_integration: true
            achievement_sharing: true

    metrics:
      - id: "combat_motivation_score"
        name: "Combat Motivation Score"
        description: "How motivated players are to engage in combat"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

      - id: "combat_session_frequency"
        name: "Combat Session Frequency"
        description: "How often players engage in combat sessions"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

      - id: "reward_satisfaction_rating"
        name: "Reward Satisfaction Rating"
        description: "Satisfaction with combat reward systems (1-5)"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

      - id: "long_term_retention"
        name: "Long-Term Retention"
        description: "30-day retention rate for combat-active players"
        metric_type: "retention"
        target_value: "higher"
        statistical_test: "z_test"
        significance_level: 0.05

    traffic_allocation_type: "uniform"
    target_audience:
      all_users: false
      min_level: 10
      combat_frequency_threshold: 3  # per week

    sample_size_requirements:
      minimum_sample_size: 1800
      desired_power: 0.8

    duration:
      planned_days: 30

# Global combat experiment settings
global_settings:
  balance_constraints:
    max_damage_multiplier: 5.0
    min_damage_multiplier: 0.5
    max_combat_duration: 300  # seconds
    min_combat_duration: 30   # seconds

  difficulty_scaling:
    player_level_scaling: true
    enemy_ai_difficulty: "adaptive"
    environmental_difficulty: true
    group_size_scaling: true

  safety_limits:
    damage_variance_cap: 0.3
    critical_hit_cap: 0.25
    miss_chance_cap: 0.5
    reward_multiplier_cap: 3.0

  performance_monitoring:
    combat_performance_tracking: true
   .player_behavior_analysis: true
   .balance_metrics_collection: true
   .exploitation_detection: true

# Success criteria for combat experiments
success_criteria:
  primary_metric_improvement: 0.12  # 12% improvement
  player_satisfaction_minimum: 4.0  # out of 5
  combat_completion_rate_target: 0.85  # 85% completion
  difficulty_balance_score: 0.7  # 70% perceive difficulty as balanced

rollback_conditions:
  game_balance_issues: true
  player_complaint_rate: 0.08  # 8% complaint rate
  exploit_detection: true
  performance_degradation: 0.30  # 30% slower
  accessibility_issues: true

# Integration settings
integrations:
  character_systems:
    skill_integration: true
    character_progression: true
    equipment_integration: true
    ability_systems: true

  world_systems:
    enemy_ai_integration: true
    environmental_systems: true
    quest_integration: true
    loot_systems: true

  analytics:
    combat_analytics: true
    balance_monitoring: true
    player_behavior_tracking: true
   .reward_system_analytics: true