# Dialogue System A/B Testing Experiments Configuration
# DMLogn8n Multi-Agent Platform

experiments:
  # Experiment 1: Dialogue Style Variations
  exp_dialogue_style_variations:
    name: "Dialogue Style Variations Test"
    description: "Test different dialogue styles and narrative approaches"
    status: "draft"
    tags: ["dialogue", "narrative", "style", "engagement"]

    hypothesis:
      primary_metric: "dialogue_engagement_time"
      expected_effect: "increase"
      expected_magnitude: 0.20
      confidence_level: 0.95

    variants:
      - id: "control_standard"
        name: "Standard Dialogue (Control)"
        description: "Standard dialogue style with balanced tone"
        traffic_percentage: 25.0
        is_control: true
        config:
          style: "standard"
          tone: "balanced"
          length: "medium"
          vocabulary_level: "intermediate"
          personality_traits:
            friendliness: 0.7
            helpfulness: 0.8
            creativity: 0.6
            humor: 0.4

      - id: "variant_immersive"
        name: "Immersive Narrative"
        description: "Rich, descriptive narrative style with world-building"
        traffic_percentage: 25.0
        config:
          style: "immersive"
          tone: "descriptive"
          length: "long"
          vocabulary_level: "advanced"
          personality_traits:
            friendliness: 0.6
            helpfulness: 0.7
            creativity: 0.9
            humor: 0.3
            world_knowledge: 0.8
            description_detail: 0.9

      - id: "variant_concise"
        name: "Concise & Direct"
        description: "Short, direct responses focused on action"
        traffic_percentage: 25.0
        config:
          style: "concise"
          tone: "direct"
          length: "short"
          vocabulary_level: "basic"
          personality_traits:
            friendliness: 0.8
            helpfulness: 0.9
            creativity: 0.4
            humor: 0.2
            efficiency: 0.9

      - id: "variant_character_driven"
        name: "Character-Driven Dialogue"
        description: "Strong character voice and personality-driven responses"
        traffic_percentage: 25.0
        config:
          style: "character_driven"
          tone: "personalized"
          length: "medium"
          vocabulary_level: "intermediate"
          personality_traits:
            friendliness: 0.7
            helpfulness: 0.8
            creativity: 0.8
            humor: 0.6
            character_consistency: 0.9
            emotional_range: 0.8

    metrics:
      - id: "dialogue_engagement_time"
        name: "Dialogue Engagement Time"
        description: "Average time users spend reading and interacting with dialogue"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05
        minimum_effect_size: 0.15

      - id: "dialogue_satisfaction_rating"
        name: "Dialogue Satisfaction Rating"
        description: "User satisfaction ratings for dialogue quality (1-5)"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "mann_whitney"
        significance_level: 0.05
        minimum_effect_size: 0.10

      - id: "conversation_depth"
        name: "Conversation Depth"
        description: "Average number of dialogue exchanges per conversation"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

      - id: "response_clarity_score"
        name: "Response Clarity Score"
        description: "How clear and understandable responses are perceived to be"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

      - id: "emotional_engagement"
        name: "Emotional Engagement"
        description: "Measures of emotional response and connection"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

    traffic_allocation_type: "uniform"
    target_audience:
      all_users: false
      segments: ["story_lovers", "power_users"]
      min_level: 3
      platforms: ["web", "desktop", "mobile"]

    sample_size_requirements:
      minimum_sample_size: 2500
      desired_power: 0.8

    duration:
      planned_days: 21

  # Experiment 2: Interactive Dialogue Elements
  exp_interactive_dialogue_elements:
    name: "Interactive Dialogue Elements Test"
    description: "Test different interactive elements and dialogue choices"
    status: "draft"
    tags: ["dialogue", "interactive", "choices", "engagement"]

    hypothesis:
      primary_metric: "choice_interaction_rate"
      expected_effect: "increase"
      expected_magnitude: 0.25
      confidence_level: 0.90

    variants:
      - id: "control_text_only"
        name: "Text-Only Dialogue (Control)"
        description: "Traditional text-based dialogue without interactive elements"
        traffic_percentage: 25.0
        is_control: true
        config:
          interactive_elements: false
          dialogue_choices: false
          emotion_indicators: false
          quick_responses: false
          voice_options: false

      - id: "variant_choice_system"
        name: "Choice System"
        description: "Multiple dialogue choices with branching paths"
        traffic_percentage: 25.0
        config:
          interactive_elements: true
          dialogue_choices: true
          max_choices_per_response: 4
          choice_types:
            - "action"
            - "question"
            - "emotional_response"
            - "investigation"
          branching_complexity: "medium"
          consequence_system: true

      - id: "variant_emotion_feedback"
        name: "Emotion Feedback System"
        description: "Emotion indicators and mood tracking"
        traffic_percentage: 25.0
        config:
          interactive_elements: true
          emotion_indicators: true
          mood_tracking: true
          emotion_display: "visual_and_text"
          emotional_responses: true
          mood_impact_on_dialogue: true

      - id: "variant_quick_interactions"
        name: "Quick Interactions"
        description: "Quick response options and streamlined interface"
        traffic_percentage: 25.0
        config:
          interactive_elements: true
          quick_responses: true
          response_suggestions: true
          one_click_actions: true
          interaction_shortcuts: true
          gesture_support: true

    metrics:
      - id: "choice_interaction_rate"
        name: "Choice Interaction Rate"
        description: "Percentage of users who interact with dialogue choices"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "z_test"
        significance_level: 0.05

      - id: "time_to_first_interaction"
        name: "Time to First Interaction"
        description: "Time before user first interacts with dialogue elements"
        metric_type: "engagement"
        target_value: "lower"
        statistical_test: "mann_whitney"
        significance_level: 0.05

      - id: "interaction_diversity"
        name: "Interaction Diversity"
        description: "Variety of different interaction types used"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

      - id: "user_satisfaction_with_choices"
        name: "User Satisfaction with Choices"
        description: "How satisfied users are with available dialogue choices"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

    traffic_allocation_type: "uniform"
    target_audience:
      all_users: false
      segments: ["new_users", "casual_players"]
      min_account_age_days: 3

    sample_size_requirements:
      minimum_sample_size: 2000
      desired_power: 0.8

    duration:
      planned_days: 14

  # Experiment 3: Personalized Dialogue Adaptation
  exp_personalized_dialogue_adaptation:
    name: "Personalized Dialogue Adaptation"
    description: "Test AI adaptation to user preferences and playstyle"
    status: "draft"
    tags: ["dialogue", "personalization", "ai", "adaptation"]

    hypothesis:
      primary_metric: "personalization_satisfaction"
      expected_effect: "increase"
      expected_magnitude: 0.18
      confidence_level: 0.95

    variants:
      - id: "control_generic"
        name: "Generic Responses (Control)"
        description: "Standard responses without personalization"
        traffic_percentage: 25.0
        is_control: true
        config:
          personalization_enabled: false
          user_learning: false
          adaptation_speed: "none"
          preference_detection: false

      - id: "variant_style_learning"
        name: "Style Learning"
        description: "AI learns user's preferred dialogue style"
        traffic_percentage: 25.0
        config:
          personalization_enabled: true
          user_learning: true
          adaptation_speed: "gradual"
          preference_detection: true
          learning_parameters:
            response_length_preference: true
            formality_preference: true
            humor_preference: true
            detail_preference: true
          adaptation_triggers:
            - "user_feedback"
            - "interaction_patterns"
            - "time_spent_reading"

      - id: "variant_content_adaptation"
        name: "Content Adaptation"
        description: "AI adapts content based on user interests and history"
        traffic_percentage: 25.0
        config:
          personalization_enabled: true
          user_learning: true
          adaptation_speed: "moderate"
          preference_detection: true
          content_tracking:
            topic_interests: true
            character_preferences: true
            story_element_tracking: true
            quest_preferences: true
          adaptation_methods:
            - "topic_personalization"
            - "character_relationship_building"
            - "story_element_emphasis"

      - id: "variant_rapid_adaptation"
        name: "Rapid Adaptation"
        description: "Fast adaptation with immediate response to user behavior"
        traffic_percentage: 25.0
        config:
          personalization_enabled: true
          user_learning: true
          adaptation_speed: "rapid"
          preference_detection: true
          real_time_adaptation: true
          behavioral_tracking:
            - "response_time_patterns"
            - "choice_patterns"
            - "engagement_signals"
            - "abandonment_points"
          adaptation_frequency: "per_interaction"

    metrics:
      - id: "personalization_satisfaction"
        name: "Personalization Satisfaction"
        description: "User satisfaction with personalized dialogue"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

      - id: "adaptation_accuracy"
        name: "Adaptation Accuracy"
        description: "How accurately AI adapts to user preferences"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

      - id: "user_retention_personalized"
        name: "User Retention (Personalized)"
        description: "Retention rate for users receiving personalized dialogue"
        metric_type: "retention"
        target_value: "higher"
        statistical_test: "z_test"
        significance_level: 0.05

      - id: "engagement_improvement_over_time"
        name: "Engagement Improvement Over Time"
        description: "How engagement improves as personalization increases"
        metric_type: "engagement"
        target_value: "higher"
        statistical_test: "t_test"
        significance_level: 0.05

    traffic_allocation_type: "uniform"
    target_audience:
      all_users: false
      min_sessions: 5
      segments: ["power_users", "story_lovers"]

    sample_size_requirements:
      minimum_sample_size: 1500
      desired_power: 0.8

    duration:
      planned_days: 28
      minimum_days: 21

# Global dialogue experiment settings
global_settings:
  content_safety:
    profanity_filter: true
    content_moderation: true
    age_appropriate_content: true
    cultural_sensitivity: true

  performance_limits:
    max_response_length: 500
    max_response_time: 5000  # milliseconds
    max_choices_per_dialogue: 6
    min_choice_clarity_score: 0.7

  data_collection:
    dialogue_analytics: true
    user_interaction_tracking: true
    sentiment_analysis: true
    topic_modeling: true
    personalization_metrics: true

  user_experience:
    loading_indicators: true
    error_handling: graceful
    accessibility_features: true
    mobile_optimization: true

# Success criteria for dialogue experiments
success_criteria:
  primary_metric_threshold: 0.15  # 15% improvement
  user_satisfaction_minimum: 4.0  # out of 5
  engagement_retention_ratio: 0.8  # maintain 80% of control
  accessibility_compliance: 0.95  # 95% accessibility score

rollback_triggers:
  critical_bugs: true
  user_complaint_rate: 0.05  # 5% complaint rate
  performance_degradation: 0.25  # 25% slower
  content_safety_violations: 10  # per day
  accessibility_score_drop: 0.10  # 10% drop

# Integration settings
integrations:
  content_management:
    dialogue_database: true
    character_profiles: true
    story_elements: true
    quest_integration: true

  analytics:
    real_time_monitoring: true
    dialogue_analytics: true
    user_behavior_tracking: true
    a_b_test_reporting: true

  user_feedback:
    in_dialogue_ratings: true
    feedback_collection: true
    sentiment_analysis: true
    bug_reporting: true