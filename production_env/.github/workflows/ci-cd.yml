name: DMLog CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  schedule:
    # Nightly build at 2 AM UTC
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Code Quality and Security
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r source_code/backend/requirements.txt
          pip install flake8 black isort mypy bandit safety pytest-cov

      - name: Code formatting check (black)
        run: black --check --diff source_code/backend/

      - name: Import sorting check (isort)
        run: isort --check-only --diff source_code/backend/

      - name: Linting (flake8)
        run: flake8 source_code/backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Type checking (mypy)
        run: mypy source_code/backend/ --ignore-missing-imports --no-strict-optional

      - name: Security scan (bandit)
        run: bandit -r source_code/backend/ -f json -o bandit-report.json

      - name: Dependency security scan (safety)
        run: safety check --json --output safety-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dmlog_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      qdrant:
        image: qdrant/qdrant:latest
        options: >-
          --health-cmd "curl -f http://localhost:6333/health"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3
        ports:
          - 6333:6333

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r source_code/backend/requirements.txt
          pip install pytest pytest-cov pytest-mock pytest-asyncio

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dmlog_test
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
        run: |
          cd source_code/backend
          pytest tests/unit/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./source_code/backend/coverage.xml
          flags: unit-tests
          name: codecov-umbrella

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test environment
        run: |
          docker-compose -f production_env/docker/docker-compose.test.yml up -d

      - name: Wait for services
        run: |
          python production_env/scripts/wait_for_services.py

      - name: Run integration tests
        run: |
          docker-compose -f production_env/docker/docker-compose.test.yml \
            exec -T api pytest tests/integration/ -v

      - name: Collect logs
        if: always()
        run: |
          docker-compose -f production_env/docker/docker-compose.test.yml logs > integration-test.log

      - name: Upload logs
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-logs
          path: integration-test.log

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f production_env/docker/docker-compose.test.yml down -v

  # Build Docker Images
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: source_code
          file: production_env/docker/Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-api
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push GPU Trainer image
        uses: docker/build-push-action@v5
        with:
          context: source_code
          file: production_env/docker/Dockerfile.gpu
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-gpu
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # End-to-End Tests
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Deploy to staging cloud environment

      - name: Run E2E tests
        run: |
          echo "Running E2E tests..."
          # Run Playwright/Cypress tests
          npm run test:e2e

      - name: Generate test report
        if: always()
        run: |
          # Generate HTML test report
          npm run test:report

      - name: Upload E2E report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-report
          path: e2e-report/

  # Security Scanning
  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name != 'pull_request'

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-images.outputs.image-tag }}-api
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to performance test environment
        run: |
          echo "Deploying for performance testing..."

      - name: Run load tests
        run: |
          # Use k6 or Artillery for load testing
          docker run --rm -i loadimpact/k6 run - <<EOF
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export let options = {
            stages: [
              { duration: '2m', target: 100 },
              { duration: '5m', target: 100 },
              { duration: '2m', target: 0 },
            ],
            thresholds: {
              http_req_duration: ['p(99)<1500'],
              http_req_failed: ['rate<0.1'],
            },
          };

          export default function() {
            let response = http.get('${{ secrets.STAGING_URL }}/health');
            check(response, {
              'status was 200': (r) => r.status == 200,
              'response time was ok': (r) => r.timings.duration < 500,
            });
            sleep(1);
          }
          EOF

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images, e2e-tests, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://api.dmlog.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        run: |
          # Update ECS service or deploy to EC2
          aws ecs update-service \
            --cluster dmlog-prod \
            --service api-service \
            --force-new-deployment

      - name: Deploy to Jetson devices
        run: |
          # Trigger deployment to Jetson devices
          curl -X POST "${{ secrets.JETSON_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.JETSON_TOKEN }}" \
            -d '{"image": "${{ needs.build-images.outputs.image-tag }}"}'

      - name: Run smoke tests
        run: |
          # Verify deployment health
          python production_env/scripts/smoke_tests.py \
            --url https://api.dmlog.com

      - name: Update monitoring dashboards
        run: |
          # Update Grafana dashboards with new deployment info
          curl -X POST "${{ secrets.GRAFANA_WEBHOOK }}" \
            -d '{"deployment": "${{ github.sha }}", "version": "${{ needs.build-images.outputs.image-tag }}"}'

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow

  # Database Migration
  migrate-database:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[migrate]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run database migration
        run: |
          # Connect to production database
          # Run migration scripts
          python production_env/scripts/migrate_production.py \
            --url "${{ secrets.PROD_DB_URL }}" \
            --backup

      - name: Validate migration
        run: |
          python production_env/scripts/validate_migration.py \
            --url "${{ secrets.PROD_DB_URL }}"

      - name: Rollback on failure
        if: failure()
        run: |
          python production_env/scripts/rollback_database.py \
            --url "${{ secrets.PROD_DB_URL }}"

  # Nightly Build and Test
  nightly-build:
    name: Nightly Build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and test all variants
        run: |
          # Build for all platforms
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            -f production_env/docker/Dockerfile.prod \
            -t dmlog:nightly \
            .

      - name: Run full test suite
        run: |
          # Run comprehensive tests
          pytest tests/ -v --cov

      - name: Generate nightly report
        run: |
          python production_env/scripts/nightly_report.py

      - name: Email report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "DMLog Nightly Build Report"
          body: file://nightly_report.html
          to: dev-team@dmlog.com

  # Cleanup
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()

    steps:
      - name: Clean up old images
        run: |
          # Remove old Docker images from registry
          # Keep only last 30 versions
          aws ecr describe-images \
            --repository-name dmlog \
            --query 'sort_by(imageDetails, &imagePushedAt)[30:].imageDigest' \
            --output text | \
          xargs -I {} aws ecr batch-delete-image \
            --repository-name dmlog \
            --image-ids imageDigest={}

      - name: Clean up test artifacts
        uses: actions/github-script@v6
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            // Keep artifacts for 30 days
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - 30);

            for (const artifact of artifacts.data.artifacts) {
              const createdDate = new Date(artifact.created_at);
              if (createdDate < cutoffDate) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }