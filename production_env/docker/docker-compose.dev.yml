version: '3.8'

services:
  # PostgreSQL Database (Development)
  postgres:
    image: postgres:15-alpine
    container_name: dmlog_postgres_dev
    environment:
      POSTGRES_DB: dmlog_dev
      POSTGRES_USER: dmlog_user
      POSTGRES_PASSWORD: dmlog_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - dmlog_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmlog_user -d dmlog_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache (Development)
  redis:
    image: redis:7-alpine
    container_name: dmlog_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - dmlog_network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.6.0
    container_name: dmlog_qdrant_dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data_dev:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__LOG_LEVEL=DEBUG
    networks:
      - dmlog_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Commander (Redis UI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: dmlog_redis_ui_dev
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - dmlog_network
    depends_on:
      - redis
    restart: unless-stopped

  # PgAdmin (PostgreSQL UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dmlog_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dmlog.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin
    networks:
      - dmlog_network
    depends_on:
      - postgres
    restart: unless-stopped

  # API Server (Development with Hot Reload)
  api:
    build:
      context: ../../source_code
      dockerfile: production_env/docker/Dockerfile.dev
    container_name: dmlog_api_dev
    ports:
      - "8000:8000"
      - "5678:5678"  # Debug port
    environment:
      - DATABASE_URL=postgresql://dmlog_user:dmlog_password@postgres:5432/dmlog_dev
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - DEBUG=true
      - RELOAD=true
    volumes:
      - ../../source_code:/app
      - api_logs_dev:/app/logs
      - ./uploads:/app/uploads
    networks:
      - dmlog_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  # Task Queue Worker (Development)
  worker:
    build:
      context: ../../source_code
      dockerfile: production_env/docker/Dockerfile.dev
    container_name: dmlog_worker_dev
    environment:
      - DATABASE_URL=postgresql://dmlog_user:dmlog_password@postgres:5432/dmlog_dev
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
    volumes:
      - ../../source_code:/app
      - worker_logs_dev:/app/logs
      - ./uploads:/app/uploads
    networks:
      - dmlog_network
    depends_on:
      - redis
      - postgres
      - api
    restart: unless-stopped
    command: rq worker --url redis://redis:6379/0 --with-scheduler

  # ML Training Service (CPU-only for dev)
  ml-trainer:
    build:
      context: ../../source_code
      dockerfile: production_env/docker/Dockerfile.dev
    container_name: dmlog_ml_trainer_dev
    environment:
      - DATABASE_URL=postgresql://dmlog_user:dmlog_password@postgres:5432/dmlog_dev
      - REDIS_URL=redis://redis:6379/0
      - CUDA_VISIBLE_DEVICES=""  # Force CPU mode for development
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
    volumes:
      - ../../source_code:/app
      - ml_models_dev:/app/models
      - ml_logs_dev:/app/logs
    networks:
      - dmlog_network
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    command: python -m uvicorn training_service:app --host 0.0.0.0 --port 8001 --reload

  # Prometheus (Metrics Collection)
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: dmlog_prometheus_dev
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.dev.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_dev:/prometheus
    networks:
      - dmlog_network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:10.0.0
    container_name: dmlog_grafana_dev
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - dmlog_network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: dmlog_jaeger_dev
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - dmlog_network
    restart: unless-stopped

  # MinIO (S3-compatible storage for models)
  minio:
    image: minio/minio:RELEASE.2023-10-07T15-23-28Z
    container_name: dmlog_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data_dev:/data
    networks:
      - dmlog_network
    restart: unless-stopped
    command: server /data --console-address ":9001"

networks:
  dmlog_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data_dev:
  redis_data_dev:
  qdrant_data_dev:
  pgadmin_data_dev:
  api_logs_dev:
  worker_logs_dev:
  ml_logs_dev:
  ml_models_dev:
  prometheus_data_dev:
  grafana_data_dev:
  minio_data_dev: