version: '3.8'

services:
  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: dmlog_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - dmlog_network
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Server - Multiple Replicas
  api:
    build:
      context: ../../source_code
      dockerfile: production_env/docker/Dockerfile.prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - QDRANT_URL=${QDRANT_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - SENTRY_DSN=${SENTRY_DSN}
      - OTLP_ENDPOINT=http://jaeger:14268/api/traces
    volumes:
      - api_logs:/app/logs
      - file_storage:/app/storage
    networks:
      - dmlog_network
    depends_on:
      - postgres
      - redis
      - qdrant
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # Task Queue Workers
  worker:
    build:
      context: ../../source_code
      dockerfile: production_env/docker/Dockerfile.prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - QDRANT_URL=${QDRANT_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    volumes:
      - worker_logs:/app/logs
      - file_storage:/app/storage
    networks:
      - dmlog_network
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    command: rq worker --url ${REDIS_URL} high medium low --with-scheduler
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ML Training Service (GPU-enabled)
  ml-trainer:
    build:
      context: ../../source_code
      dockerfile: production_env/docker/Dockerfile.gpu
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CUDA_VISIBLE_DEVICES=0,1
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - MODEL_REGISTRY_S3_BUCKET=${MODEL_REGISTRY_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ml_models:/app/models
      - ml_logs:/app/logs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    networks:
      - dmlog_network
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # PostgreSQL Database (External in production)
  # This service is disabled for production - use external RDS
  # postgres:
  #   image: postgres:15-alpine
  #   ... (configuration for staging only)

  # Redis Cluster
  redis:
    image: redis:7-alpine
    container_name: dmlog_redis_prod
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - dmlog_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Qdrant Vector Database (Production with replicas)
  qdrant:
    image: qdrant/qdrant:v1.6.0
    container_name: dmlog_qdrant_prod
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=32
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=4
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/production.yaml:ro
    networks:
      - dmlog_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: dmlog_prometheus_prod
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
    networks:
      - dmlog_network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'

  grafana:
    image: grafana/grafana:10.0.0
    container_name: dmlog_grafana_prod
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - dmlog_network
    depends_on:
      - prometheus
    restart: unless-stopped

  # AlertManager
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: dmlog_alertmanager_prod
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - dmlog_network
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://alertmanager:9093'

  # Jaeger for Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: dmlog_jaeger_prod
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
    volumes:
      - jaeger_data:/badger
    networks:
      - dmlog_network
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Elasticsearch for Log Storage
  elasticsearch:
    image: elasticsearch:8.10.0
    container_name: dmlog_elasticsearch_prod
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - dmlog_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Kibana for Log Visualization
  kibana:
    image: kibana:8.10.0
    container_name: dmlog_kibana_prod
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - dmlog_network
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Filebeat for Log Shipping
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.10.0
    container_name: dmlog_filebeat_prod
    user: root
    volumes:
      - ./monitoring/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - api_logs:/var/log/app/api:ro
      - worker_logs:/var/log/app/worker:ro
      - ml_logs:/var/log/app/ml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dmlog_network
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Redis Exporter for Metrics
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: dmlog_redis_exporter_prod
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - dmlog_network
    depends_on:
      - redis
    restart: unless-stopped

  # Postgres Exporter for Metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: dmlog_postgres_exporter_prod
    environment:
      - DATA_SOURCE_NAME=${DATABASE_URL}
    networks:
      - dmlog_network
    restart: unless-stopped

networks:
  dmlog_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  api_logs:
  worker_logs:
  ml_logs:
  nginx_logs:
  ml_models:
  file_storage:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  jaeger_data:
  elasticsearch_data: