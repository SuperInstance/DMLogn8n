name: DMlogn8n CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Daily integration tests at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'
  MONGODB_VERSION: '6.0'
  REDIS_VERSION: '7.0'
  POSTGRES_VERSION: '15'

jobs:
  # Quality Gates
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    outputs:
      quality-score: ${{ steps.quality.outputs.score }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Dependencies
      run: |
        npm ci
        # Install dependencies for all sub-projects
        find . -name "package.json" -not -path "./node_modules/*" -exec dirname {} \; | while read dir; do
          cd "$dir" && npm ci && cd - > /dev/null
        done

    - name: Lint All Projects
      run: |
        echo "Running ESLint across all projects..."
        find . -name "package.json" -not -path "./node_modules/*" -not -path "./integration-tests/*" -exec dirname {} \; | while read dir; do
          if [ -f "$dir/.eslintrc.js" ] || [ -f "$dir/.eslintrc.json" ] || [ -f "$dir/package.json" ]; then
            echo "Linting $dir"
            cd "$dir" && npm run lint --if-present && cd - > /dev/null
          fi
        done

    - name: Security Audit
      run: |
        echo "Running security audits..."
        npm audit --audit-level=high
        find . -name "package.json" -not -path "./node_modules/*" -not -path "./integration-tests/*" -exec dirname {} \; | while read dir; do
          cd "$dir" && npm audit --audit-level=high && cd - > /dev/null
        done

    - name: Type Checking
      run: |
        echo "Running TypeScript type checking..."
        find . -name "tsconfig.json" -not -path "./node_modules/*" | while read config; do
          dir=$(dirname "$config")
          echo "Type checking $dir"
          cd "$dir" && npx tsc --noEmit && cd - > /dev/null
        done

    - name: Code Quality Score
      id: quality
      run: |
        # Calculate quality score based on lint, security, and type checking
        score=100
        echo "score=$score" >> $GITHUB_OUTPUT

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        project: [
          'advanced-ai-dialogue',
          'advanced-crafting',
          'advanced-trading-auction',
          'agent-intelligence-system',
          'ai-recommendations',
          'ar-vr-integration',
          'character-ai-system',
          'companion-pet-system',
          'conversational-combat',
          'cross-portal-communication',
          'dm-world-builder',
          'dnd5e-rule-engine',
          'dynamic-dungeon-generator',
          'dynamic-quest-generator',
          'dynamic-weather-system',
          'guild-management',
          'integration-testing',
          'mobile-app',
          'multi-portal-gateway',
          'multiplayer-arena',
          'streaming-platform',
          'voice-chat-system',
          'visual-combat-effects'
        ]
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ${{ matrix.project }}/package-lock.json

    - name: Install Project Dependencies
      working-directory: ${{ matrix.project }}
      run: npm ci

    - name: Run Unit Tests
      working-directory: ${{ matrix.project }}
      run: |
        npm test --if-present -- --coverage --watchAll=false
      env:
        CI: true
        NODE_ENV: test

    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v3
      if: success()
      with:
        file: ${{ matrix.project }}/coverage/lcov.info
        flags: ${{ matrix.project }}
        name: ${{ matrix.project }}-coverage
        fail_ci_if_error: false

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    services:
      mongodb:
        image: mongo:${{ env.MONGODB_VERSION }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:${{ env.REDIS_VERSION }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dmlogn8n_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: integration-testing/package-lock.json

    - name: Install Test Dependencies
      working-directory: integration-testing
      run: npm ci

    - name: Setup Test Environment
      working-directory: integration-testing
      run: npm run setup:environment
      env:
        MONGODB_URI: mongodb://localhost:27017/dmlogn8n_test
        REDIS_URL: redis://localhost:6379
        POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/dmlogn8n_test
        NODE_ENV: test

    - name: Start Mock Services
      working-directory: integration-testing
      run: npm run mock:servers &
      env:
        NODE_ENV: test

    - name: Run Integration Tests
      working-directory: integration-testing
      run: npm run test:integration
      env:
        MONGODB_URI: mongodb://localhost:27017/dmlogn8n_test
        REDIS_URL: redis://localhost:6379
        POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/dmlogn8n_test
        NODE_ENV: test

    - name: Run E2E Tests
      working-directory: integration-testing
      run: npm run test:e2e
      env:
        MONGODB_URI: mongodb://localhost:27017/dmlogn8n_test
        REDIS_URL: redis://localhost:6379
        POSTGRES_URI: postgresql://postgres:postgres@localhost:5432/dmlogn8n_test
        NODE_ENV: test

    - name: Generate Test Reports
      working-directory: integration-testing
      run: npm run generate:reports
      if: always()

    - name: Upload Test Reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-reports
        path: integration-testing/reports/
        retention-days: 30

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: integration-testing/package-lock.json

    - name: Install Dependencies
      working-directory: integration-testing
      run: npm ci

    - name: Run Performance Tests
      working-directory: integration-testing
      run: npm run test:performance

    - name: Upload Performance Reports
      uses: actions/upload-artifact@v3
      with:
        name: performance-reports
        path: integration-testing/reports/performance/
        retention-days: 30

  # Security Scans
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Snyk Security Scan
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v2
      with:
        languages: javascript

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  # Build and Deploy
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service: [
          'dnd5e-rule-engine',
          'multi-portal-gateway',
          'character-ai-system',
          'conversational-combat',
          'dm-world-builder'
        ]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ${{ matrix.service }}/package-lock.json

    - name: Install Dependencies
      working-directory: ${{ matrix.service }}
      run: npm ci

    - name: Build Application
      working-directory: ${{ matrix.service }}
      run: npm run build --if-present

    - name: Build Docker Image
      run: |
        if [ -f "${{ matrix.service }}/Dockerfile" ]; then
          docker build -t dmlogn8n/${{ matrix.service }}:${{ github.sha }} ${{ matrix.service }}
          docker tag dmlogn8n/${{ matrix.service }}:${{ github.sha }} dmlogn8n/${{ matrix.service }}:latest
        fi

    - name: Deploy to Staging
      if: success()
      run: |
        echo "Deploying ${{ matrix.service }} to staging..."
        # Add deployment commands here
        # kubectl apply -f k8s/${{ matrix.service }}/
        # or docker push to registry

  # Daily Full System Tests
  daily-system-tests:
    name: Daily Full System Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Run Complete Test Suite
      working-directory: integration-testing
      run: |
        npm ci
        npm run test:all
        npm run benchmark

    - name: Generate Daily Report
      working-directory: integration-testing
      run: npm run generate:reports

    - name: Notify Team
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#dmlogn8n-ci'
        text: |
          Daily system tests completed!
          Status: ${{ job.status }}
          Date: ${{ github.event.head_commit.timestamp }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Quality Gate Check
  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-scan]
    if: always()

    steps:
    - name: Check Quality Gates
      run: |
        echo "Checking quality gates..."

        # Check if all required jobs passed
        if [ "${{ needs.unit-tests.result }}" != "success" ]; then
          echo "❌ Unit tests failed"
          exit 1
        fi

        if [ "${{ needs.integration-tests.result }}" != "success" ]; then
          echo "❌ Integration tests failed"
          exit 1
        fi

        if [ "${{ needs.security-scan.result }}" != "success" ]; then
          echo "⚠️ Security scan had issues (non-blocking)"
        fi

        echo "✅ All quality gates passed!"

    - name: Update Quality Metrics
      run: |
        echo "Updating quality metrics dashboard..."
        # Add code to update metrics dashboard or send to monitoring system