name: Infrastructure Management

on:
  push:
    branches: [main]
    paths: ['deploy/terraform/**']
  pull_request:
    branches: [main]
    paths: ['deploy/terraform/**']
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'us-west-2'

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
    strategy:
      matrix:
        environment: [development, staging, production]
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd deploy/terraform/environments/${{ matrix.environment }}
          terraform init -input=false

      - name: Terraform Validate
        run: |
          cd deploy/terraform/environments/${{ matrix.environment }}
          terraform validate

      - name: Terraform Plan
        run: |
          cd deploy/terraform/environments/${{ matrix.environment }}
          terraform plan -input=false -out=tfplan -var-file=terraform.tfvars

      - name: Terraform Plan Summary
        run: |
          cd deploy/terraform/environments/${{ matrix.environment }}
          terraform show -json tfplan | jq -r '.planned_values' > plan-summary.json

      - name: Upload plan
        uses: actions/upload-artifact@v3
        with:
          name: tfplan-${{ matrix.environment }}
          path: deploy/terraform/environments/${{ matrix.environment }}/tfplan

      - name: Post plan summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const plan = JSON.parse(fs.readFileSync('deploy/terraform/environments/${{ matrix.environment }}/plan-summary.json', 'utf8'));

            const comment = `## Terraform Plan for ${{ matrix.environment }}

            This plan will make the following changes:

            **Resources to add:** ${plan.resource_changes?.filter(r => r.change.actions.includes('create')).length || 0}
            **Resources to change:** ${plan.resource_changes?.filter(r => r.change.actions.includes('update')).length || 0}
            **Resources to destroy:** ${plan.resource_changes?.filter(r => r.change.actions.includes('delete')).length || 0}

            [View detailed plan in the Actions tab](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        environment: [development, staging]
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download plan
        uses: actions/download-artifact@v3
        with:
          name: tfplan-${{ matrix.environment }}
          path: deploy/terraform/environments/${{ matrix.environment }}

      - name: Terraform Init
        run: |
          cd deploy/terraform/environments/${{ matrix.environment }}
          terraform init -input=false

      - name: Terraform Apply
        run: |
          cd deploy/terraform/environments/${{ matrix.environment }}
          terraform apply -input=false -auto-approve tfplan

      - name: Update state file
        run: |
          cd deploy/terraform/environments/${{ matrix.environment }}
          terraform output -json > outputs.json

      - name: Configure kubectl
        run: |
          cd deploy/terraform/environments/${{ matrix.environment }}
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name $(jq -r '.cluster_name.value' outputs.json)

      - name: Deploy cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml

      - name: Install ingress-nginx
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --set controller.publishService.enabled=true

      - name: Install monitoring stack
        run: |
          cd deploy/terraform/environments/${{ matrix.environment }}
          ./scripts/setup-monitoring.sh

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#infrastructure'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  terraform-apply-production:
    name: Terraform Apply Production
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && github.event.inputs.environment == 'production'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Manual approval required
        run: |
          echo "⚠️ Production infrastructure changes require manual approval"
          echo "Please review the plan and confirm before proceeding"

      - name: Terraform Init
        run: |
          cd deploy/terraform/environments/production
          terraform init -input=false

      - name: Terraform Plan
        run: |
          cd deploy/terraform/environments/production
          terraform plan -input=false -out=tfplan -var-file=terraform.tfvars

      - name: Terraform Apply
        run: |
          cd deploy/terraform/environments/production
          terraform apply -input=false -auto-approve tfplan

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#infrastructure'
          message: "🚀 Production infrastructure updated!"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  security-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    needs: terraform-plan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download all plans
        uses: actions/download-artifact@v3
        with:
          path: plans

      - name: Run tfsec
        run: |
          tfsec ./deploy/terraform --format json --out tfsec-results.json || true

      - name: Run checkov
        run: |
          checkov -d ./deploy/terraform --framework terraform --output json --output-file-path checkov-results.json || true

      - name: Run truffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./deploy/terraform
          base: main
          head: HEAD

      - name: Upload security scan results
        uses: actions/upload-artifact@v3
        with:
          name: security-scan-results
          path: |
            tfsec-results.json
            checkov-results.json

      - name: Security scan summary
        run: |
          echo "## Infrastructure Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f tfsec-results.json ]; then
            echo "### tfsec Results" >> $GITHUB_STEP_SUMMARY
            jq -r '.results | length' tfsec-results.json | xargs -I {} echo "- Issues found: {}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f checkov-results.json ]; then
            echo "### Checkov Results" >> $GITHUB_STEP_SUMMARY
            jq -r '.summary.failed' checkov-results.json | xargs -I {} echo "- Failed checks: {}" >> $GITHUB_STEP_SUMMARY
            jq -r '.summary.passed' checkov-results.json | xargs -I {} echo "- Passed checks: {}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

  cost-estimation:
    name: Infrastructure Cost Estimation
    runs-on: ubuntu-latest
    needs: terraform-plan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download plans
        uses: actions/download-artifact@v3
        with:
          path: plans

      - name: Run infracost
        run: |
          # Install infracost
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh

          # Run cost analysis for each environment
          for env in development staging production; do
            if [ -d "plans/tfplan-$env" ]; then
              cd deploy/terraform/environments/$env
              infracost breakdown --path tfplan --format json --outfile ../cost-$env.json || true
              cd ../../..
            fi
          done

      - name: Generate cost report
        run: |
          echo "## Infrastructure Cost Estimation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for env in development staging production; do
            if [ -f "deploy/terraform/environments/cost-$env.json" ]; then
              echo "### $env Environment" >> $GITHUB_STEP_SUMMARY
              jq -r '.totalMonthlyCost' "deploy/terraform/environments/cost-$env.json" | \
                xargs -I {} echo "- Estimated monthly cost: ${}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload cost reports
        uses: actions/upload-artifact@v3
        with:
          name: cost-reports
          path: deploy/terraform/environments/cost-*.json