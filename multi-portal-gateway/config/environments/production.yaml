# Production Environment Configuration for DMLogn8n Multi-Agent Platform
# This configuration is optimized for production deployment with high security and reliability

environment: production
debug: false
log_level: WARNING

# Database Configuration
database:
  databases:
    # Main application database (PostgreSQL with high availability)
    main:
      name: main
      type: postgresql
      credentials:
        username: "${DB_USERNAME}"
        password: "${DB_PASSWORD}"
        host: "${DB_HOST}"
        port: ${DB_PORT:5432}
        database: "${DB_NAME}"
      pool:
        min_connections: 10
        max_connections: 50
        connection_timeout: 10
        idle_timeout: 600
        max_lifetime: 7200
        health_check_interval: 30
      ssl:
        ssl_mode: require
        ssl_cert: "${DB_SSL_CERT}"
        ssl_key: "${DB_SSL_KEY}"
        ssl_ca: "${DB_SSL_CA}"
      retry:
        max_retries: 5
        retry_delay: 2.0
        backoff_multiplier: 2.0
        max_retry_delay: 60.0
        retry_on_errors:
          - connection_error
          - timeout_error
          - deadlock
      enabled: true
      read_only: false
      options:
        application_name: dmlogn8n_production
        connect_timeout: 10
        statement_timeout: 30000
        idle_in_transaction_session_timeout: 60000

    # Redis cache cluster
    cache:
      name: cache
      type: redis
      credentials:
        username: "${REDIS_USERNAME}"
        password: "${REDIS_PASSWORD}"
        host: "${REDIS_HOST}"
        port: ${REDIS_PORT:6379}
        database: "2"
      pool:
        min_connections: 5
        max_connections: 30
        connection_timeout: 5
        idle_timeout: 300
        health_check_interval: 15
      ssl:
        ssl_mode: require
        ssl_cert: "${REDIS_SSL_CERT}"
        ssl_key: "${REDIS_SSL_KEY}"
        ssl_ca: "${REDIS_SSL_CA}"
      enabled: true
      options:
        decode_responses: true
        socket_connect_timeout: 5
        socket_timeout: 5
        max_connections: 30
        retry_on_timeout: true
        health_check_interval: 15

    # Read replica for analytics and reporting
    analytics:
      name: analytics
      type: postgresql
      credentials:
        username: "${DB_READ_USERNAME}"
        password: "${DB_READ_PASSWORD}"
        host: "${DB_READ_HOST}"
        port: ${DB_READ_PORT:5432}
        database: "${DB_NAME}"
      pool:
        min_connections: 5
        max_connections: 20
        connection_timeout: 15
        idle_timeout: 300
        max_lifetime: 7200
        health_check_interval: 30
      ssl:
        ssl_mode: require
        ssl_cert: "${DB_READ_SSL_CERT}"
        ssl_key: "${DB_READ_SSL_KEY}"
        ssl_ca: "${DB_READ_SSL_CA}"
      enabled: true
      read_only: true
      options:
        application_name: dmlogn8n_production_readonly
        connect_timeout: 15
        statement_timeout: 60000

    # Archive database for long-term storage
    archive:
      name: archive
      type: postgresql
      credentials:
        username: "${DB_ARCHIVE_USERNAME}"
        password: "${DB_ARCHIVE_PASSWORD}"
        host: "${DB_ARCHIVE_HOST}"
        port: ${DB_ARCHIVE_PORT:5432}
        database: "${DB_ARCHIVE_NAME}"
      pool:
        min_connections: 2
        max_connections: 10
        connection_timeout: 30
        idle_timeout: 600
        max_lifetime: 7200
      ssl:
        ssl_mode: require
        ssl_ca: "${DB_ARCHIVE_SSL_CA}"
      enabled: true
      read_only: false
      options:
        application_name: dmlogn8n_archive

  default_database: main

  # High availability clusters
  clusters:
    main_cluster:
      name: main_cluster
      primary: main
      replicas: [analytics]
      load_balancing_strategy: least_cost
      failover_timeout: 10
      health_check_interval: 5

    cache_cluster:
      name: cache_cluster
      primary: cache
      replicas: []
      load_balancing_strategy: round_robin
      failover_timeout: 5
      health_check_interval: 10

# AI Models Configuration
ai_models:
  models:
    # Primary GPT-4 for production
    gpt4_production:
      name: gpt4_production
      provider: openai
      model_id: gpt-4-turbo-preview
      model_type: chat
      capabilities:
        - text_generation
        - code_generation
        - reasoning
        - function_calling
        - vision
      credentials:
        api_key: "${OPENAI_API_KEY}"
        organization_id: "${OPENAI_ORG_ID}"
      parameters:
        temperature: 0.7
        max_tokens: 4096
        top_p: 1.0
        frequency_penalty: 0.0
        presence_penalty: 0.0
        stream: false
      rate_limiting:
        requests_per_minute: 1000
        tokens_per_minute: 300000
        concurrent_requests: 20
        retry_after_quota: true
      caching:
        enabled: true
        ttl_seconds: 7200
        max_cache_size: 5000
        cache_similar_inputs: true
        similarity_threshold: 0.98
      enabled: true
      fallback_models: ["claude3_production", "gpt35_turbo_production"]
      priority: 10
      cost_per_input_token: 0.01
      cost_per_output_token: 0.03
      quality_score: 9.5
      latency_target_ms: 2000
      tags: ["production", "chat", "reasoning", "vision", "premium"]

    # Claude 3 Opus for high-quality responses
    claude3_production:
      name: claude3_production
      provider: anthropic
      model_id: claude-3-opus-20240229
      model_type: chat
      capabilities:
        - text_generation
        - code_generation
        - reasoning
        - multimodal
        - vision
      credentials:
        api_key: "${ANTHROPIC_API_KEY}"
      parameters:
        temperature: 0.7
        max_tokens: 4096
        top_p: 1.0
      rate_limiting:
        requests_per_minute: 500
        tokens_per_minute: 200000
        concurrent_requests: 15
      caching:
        enabled: true
        ttl_seconds: 7200
        max_cache_size: 5000
      enabled: true
      fallback_models: ["gpt4_production"]
      priority: 9
      cost_per_input_token: 0.015
      cost_per_output_token: 0.075
      quality_score: 9.8
      latency_target_ms: 3000
      tags: ["production", "chat", "multimodal", "vision", "high-quality"]

    # GPT-3.5 Turbo for high-volume, cost-effective tasks
    gpt35_turbo_production:
      name: gpt35_turbo_production
      provider: openai
      model_id: gpt-3.5-turbo-16k
      model_type: chat
      capabilities:
        - text_generation
        - code_generation
        - reasoning
      credentials:
        api_key: "${OPENAI_API_KEY}"
        organization_id: "${OPENAI_ORG_ID}"
      parameters:
        temperature: 0.7
        max_tokens: 4096
        top_p: 1.0
      rate_limiting:
        requests_per_minute: 2000
        tokens_per_minute: 400000
        concurrent_requests: 30
      caching:
        enabled: true
        ttl_seconds: 3600
        max_cache_size: 10000
      enabled: true
      fallback_models: []
      priority: 8
      cost_per_input_token: 0.0015
      cost_per_output_token: 0.002
      quality_score: 8.2
      latency_target_ms: 1500
      tags: ["production", "chat", "high-volume", "cost-effective"]

    # Text embedding model
    text_embedding_production:
      name: text_embedding_production
      provider: openai
      model_id: text-embedding-ada-002
      model_type: embedding
      capabilities:
        - text_generation
      credentials:
        api_key: "${OPENAI_API_KEY}"
      parameters:
        temperature: 0.0
      rate_limiting:
        requests_per_minute: 3000
        tokens_per_minute: 1000000
      caching:
        enabled: true
        ttl_seconds: 86400  # 24 hours
        max_cache_size: 50000
      enabled: true
      priority: 6
      cost_per_input_token: 0.0001
      quality_score: 8.7
      latency_target_ms: 500
      tags: ["production", "embedding"]

    # DALL-E 3 for image generation
    dall_e3_production:
      name: dall_e3_production
      provider: openai
      model_id: dall-e-3
      model_type: image_generation
      capabilities:
        - image_generation
      credentials:
        api_key: "${OPENAI_API_KEY}"
      parameters:
        image_quality: hd
        image_size: 1024x1024
      rate_limiting:
        requests_per_minute: 20
        concurrent_requests: 5
      caching:
        enabled: true
        ttl_seconds: 604800  # 7 days
        max_cache_size: 1000
      enabled: true
      priority: 5
      cost_per_output_token: 0.08  # HD quality
      quality_score: 9.2
      latency_target_ms: 15000
      tags: ["production", "image-generation", "premium"]

    # Whisper for audio transcription
    whisper_production:
      name: whisper_production
      provider: openai
      model_id: whisper-1
      model_type: audio_transcription
      capabilities:
        - audio_transcription
      credentials:
        api_key: "${OPENAI_API_KEY}"
      parameters:
        language: en
        response_format: json
      rate_limiting:
        requests_per_minute: 50
        concurrent_requests: 3
      caching:
        enabled: true
        ttl_seconds: 86400
        max_cache_size: 500
      enabled: true
      priority: 4
      cost_per_output_token: 0.006  # Per minute
      quality_score: 9.0
      latency_target_ms: 20000
      tags: ["production", "audio-transcription"]

  pools:
    production_chat:
      name: production_chat
      models: ["gpt4_production", "claude3_production", "gpt35_turbo_production"]
      strategy: best_quality
      health_check_interval: 30
      failure_threshold: 2
      recovery_threshold: 1

    high_volume_chat:
      name: high_volume_chat
      models: ["gpt35_turbo_production"]
      strategy: fastest
      health_check_interval: 15
      failure_threshold: 2
      recovery_threshold: 1

    premium_models:
      name: premium_models
      models: ["gpt4_production", "claude3_production"]
      strategy: best_quality
      health_check_interval: 30
      failure_threshold: 1
      recovery_threshold: 1

  default_models:
    chat: gpt4_production
    embedding: text_embedding_production
    image_generation: dall_e3_production
    audio_transcription: whisper_production

  global_settings:
    default_timeout: 120
    max_retries: 5
    retry_delay: 2.0
    circuit_breaker_threshold: 10
    circuit_breaker_timeout: 300
    request_timeout: 180
    cost_tracking_enabled: true
    quality_monitoring: true

# Monitoring Configuration
monitoring:
  enabled: true
  backend: prometheus
  namespace: dmlogn8n
  service_name: dmlogn8n_production
  version: 1.0.0
  environment: production
  sample_rate: 1.0

  prometheus:
    port: 9090
    metrics_path: /metrics
    job_name: dmlogn8n_production
    instance_name: "${HOSTNAME}"
    push_gateway: "${PROMETHEUS_PUSH_GATEWAY}"
    push_interval: 15

  logging:
    level: WARNING
    format: json
    console_output: false
    file_path: /var/log/dmlogn8n/production.log
    max_file_size: 1GB
    max_files: 90
    compression: gzip
    structured_logging: true
    include_timestamps: true
    include_hostname: true
    include_process_id: true
    async_logging: true
    buffer_size: 4096
    flush_interval: 3

    loggers:
      "":
        level: WARNING
        handlers: [file, sentry]

      "uvicorn":
        level: INFO
        handlers: [file]

      "sqlalchemy":
        level: ERROR
        handlers: [file]

      "httpx":
        level: ERROR
        handlers: [file]

      "security":
        level: INFO
        handlers: [file, security_file]

    handlers:
      file:
        class: RotatingFileHandler
        level: WARNING
        formatter: json
        filename: /var/log/dmlogn8n/production.log
        maxBytes: 1073741824  # 1GB
        backupCount: 90

      security_file:
        class: RotatingFileHandler
        level: INFO
        formatter: json
        filename: /var/log/dmlogn8n/security.log
        maxBytes: 1073741824  # 1GB
        backupCount: 90

      sentry:
        class: sentry_sdk.integrations.logging.SentryHandler
        level: ERROR

    formatters:
      json:
        class: pythonjsonlogger.jsonlogger.JsonFormatter
        format: "%(asctime)s %(name)s %(levelname)s %(message)s %(filename)s %(lineno)d"

  health_check:
    enabled: true
    port: 8080
    path: /health
    check_interval: 10
    timeout: 2
    failure_threshold: 2
    success_threshold: 2

    checks:
      database:
        type: database
        database: main
        timeout: 2

      database_readonly:
        type: database
        database: analytics
        timeout: 3

      cache:
        type: endpoint
        endpoint: "http://localhost:6379"
        timeout: 1

      disk_space:
        type: command
        command: "df -h / | tail -1 | awk '{print $5}' | sed 's/%//'"

      memory_usage:
        type: command
        command: "free | grep Mem | awk '{printf \"%.2f\", $3/$2 * 100.0}'"

      cpu_load:
        type: command
        command: "uptime | awk -F'load average:' '{ print $2 }' | awk '{ print $1 }' | sed 's/,//'"

  metrics:
    request_count:
      name: http_requests_total
      type: counter
      description: Total number of HTTP requests
      labels:
        method: ""
        status: ""
        endpoint: ""

    request_duration:
      name: http_request_duration_seconds
      type: histogram
      description: HTTP request duration in seconds
      buckets: [0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0, 60.0]

    active_connections:
      name: active_connections
      type: gauge
      description: Number of active connections
      labels:
        type: ""

    model_usage:
      name: model_usage_total
      type: counter
      description: Total number of model API calls
      labels:
        model: ""
        provider: ""
        type: ""
        status: ""

    model_tokens:
      name: model_tokens_total
      type: counter
      description: Total number of tokens processed
      labels:
        model: ""
        provider: ""
        type: ""

    model_cost:
      name: model_cost_usd
      type: counter
      description: Total cost in USD for model usage
      labels:
        model: ""
        provider: ""

    database_connections:
      name: database_connections_active
      type: gauge
      description: Active database connections
      labels:
        database: ""

    security_events:
      name: security_events_total
      type: counter
      description: Total security events
      labels:
        event_type: ""
        severity: ""

  alert_rules:
    high_error_rate:
      name: high_error_rate
      description: High error rate detected
      condition: 'rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.02'
      severity: critical
      for_duration: 1m
      labels:
        service: dmlogn8n_production
        environment: production
      annotations:
        summary: "Critical: High error rate on dmlogn8n production"
        description: "Error rate is above 2% for the last minute"

    model_api_errors:
      name: model_api_errors
      description: Model API errors detected
      condition: 'rate(model_usage_total{status="error"}[5m]) > 20'
      severity: critical
      for_duration: 30s
      labels:
        service: dmlogn8n_production
        environment: production
      annotations:
        summary: "Critical: Model API errors are high"
        description: "More than 20 model API errors per minute"

    database_connections_high:
      name: database_connections_high
      description: Database connection usage is critical
      condition: 'database_connections_active / database_connections_max > 0.9'
      severity: critical
      for_duration: 2m
      labels:
        service: dmlogn8n_production
        environment: production
      annotations:
        summary: "Critical: Database connection usage is very high"
        description: "Database connection usage is above 90%"

    security_breach:
      name: security_breach
      description: Security breach detected
      condition: 'rate(security_events_total{severity="critical"}[1m]) > 0'
      severity: critical
      for_duration: 0s
      labels:
        service: dmlogn8n_production
        environment: production
      annotations:
        summary: "Security breach detected"
        description: "Critical security event detected"

    model_cost_spike:
      name: model_cost_spike
      description: Unusual spike in model costs
      condition: 'increase(model_cost_usd[1h]) > 500'
      severity: warning
      for_duration: 0m
      labels:
        service: dmlogn8n_production
        environment: production
      annotations:
        summary: "Model cost spike detected"
        description: "Model costs increased by more than $500 in the last hour"

  notification_channels:
    pagerduty:
      name: pagerduty
      type: webhook
      enabled: true
      settings:
        url: "${PAGERDUTY_WEBHOOK_URL}"
        method: POST
        headers:
          Content-Type: application/json
      rate_limit:
        max_per_hour: 100

    slack:
      name: slack
      type: webhook
      enabled: true
      settings:
        url: "${SLACK_WEBHOOK_URL}"
        method: POST
        headers:
          Content-Type: application/json
      rate_limit:
        max_per_hour: 200

    email:
      name: email
      type: email
      enabled: true
      settings:
        smtp_host: "${SMTP_HOST}"
        smtp_port: ${SMTP_PORT:587}
        username: "${SMTP_USERNAME}"
        password: "${SMTP_PASSWORD}"
        from_address: "${SMTP_FROM}"
        to_addresses: ["alerts@dmlogn8n.com", "ops@dmlogn8n.com"]
      rate_limit:
        max_per_hour: 50

  performance_monitoring: true
  trace_collection: true
  error_tracking: true

# Application Settings
app:
  name: DMLogn8n Multi-Agent Platform
  version: 1.0.0
  description: Production instance of DMLogn8n multi-agent platform

  # Server settings
  host: "0.0.0.0"
  port: 8000
  workers: 8
  reload: false

  # Security settings
  secret_key: "${SECRET_KEY}"
  cors_origins:
    - "https://dmlogn8n.com"
    - "https://admin.dmlogn8n.com"
    - "https://api.dmlogn8n.com"
  cors_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  cors_headers:
    - "Content-Type"
    - "Authorization"
    - "X-API-Key"
    - "X-Request-ID"

  # Session settings
  session_timeout: 1800
  max_concurrent_sessions: 1000
  secure_cookies: true
  httponly_cookies: true

  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 5000
    burst_size: 500
    per_user: true

  # SSL/TLS
  ssl:
    enabled: true
    cert_file: "${SSL_CERT_FILE}"
    key_file: "${SSL_KEY_FILE}"
    ca_file: "${SSL_CA_FILE}"

# Feature Flags
features:
  enable_config_watcher: true
  enable_metrics: true
  enable_health_checks: true
  enable_model_caching: true
  enable_rate_limiting: true
  enable_secret_management: true
  enable_api_key_rotation: true
  enable_audit_logging: true
  enable_performance_profiling: true
  enable_circuit_breaker: true
  enable_graceful_shutdown: true
  enable_security_headers: true
  enable_request_id_tracking: true
  enable_distributed_tracing: true
  enable_compliance_logging: true