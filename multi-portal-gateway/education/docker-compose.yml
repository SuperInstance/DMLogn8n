version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:15
    container_name: dmlogn8n-education-db
    environment:
      POSTGRES_DB: dmlogn8n_education
      POSTGRES_USER: dmlogn8n_user
      POSTGRES_PASSWORD: secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dmlogn8n-education-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped

  # Core Educational Services
  learning-platform:
    build:
      context: .
      dockerfile: Dockerfile.learning-platform
    container_name: dmlogn8n-learning-platform
    environment:
      - DATABASE_URL=postgresql://dmlogn8n_user:secure_password@postgres:5432/dmlogn8n_education
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  documentation-generator:
    build:
      context: .
      dockerfile: Dockerfile.documentation-generator
    container_name: dmlogn8n-documentation-generator
    environment:
      - DATABASE_URL=postgresql://dmlogn8n_user:secure_password@postgres:5432/dmlogn8n_education
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
      - ./logs:/app/logs
      - /home/activeloguser/DMLogn8n:/app/source:ro
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped

  tutorial-system:
    build:
      context: .
      dockerfile: Dockerfile.tutorial-system
    container_name: dmlogn8n-tutorial-system
    environment:
      - DATABASE_URL=postgresql://dmlogn8n_user:secure_password@postgres:5432/dmlogn8n_education
      - REDIS_URL=redis://redis:6379/2
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
      - ./logs:/app/logs
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - redis
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped

  knowledge-base:
    build:
      context: .
      dockerfile: Dockerfile.knowledge-base
    container_name: dmlogn8n-knowledge-base
    environment:
      - DATABASE_URL=postgresql://dmlogn8n_user:secure_password@postgres:5432/dmlogn8n_education
      - REDIS_URL=redis://redis:6379/3
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
      - ./logs:/app/logs
      - ./search_index:/app/search_index
      - ./wiki_repo:/app/wiki_repo
    ports:
      - "8003:8003"
    depends_on:
      - postgres
      - redis
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped

  video-platform:
    build:
      context: .
      dockerfile: Dockerfile.video-platform
    container_name: dmlogn8n-video-platform
    environment:
      - DATABASE_URL=postgresql://dmlogn8n_user:secure_password@postgres:5432/dmlogn8n_education
      - REDIS_URL=redis://redis:6379/4
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
      - ./logs:/app/logs
      - ./videos:/app/videos
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./recordings:/app/recordings
    ports:
      - "8004:8004"
      - "1935:1935"  # RTMP streaming
      - "8080:8080"  # WebRTC
    depends_on:
      - postgres
      - redis
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped

  certification-system:
    build:
      context: .
      dockerfile: Dockerfile.certification-system
    container_name: dmlogn8n-certification-system
    environment:
      - DATABASE_URL=postgresql://dmlogn8n_user:secure_password@postgres:5432/dmlogn8n_education
      - REDIS_URL=redis://redis:6379/5
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
      - ./logs:/app/logs
      - ./certificates:/app/certificates
      - ./templates:/app/templates
    ports:
      - "8005:8005"
    depends_on:
      - postgres
      - redis
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped

  community-learning:
    build:
      context: .
      dockerfile: Dockerfile.community-learning
    container_name: dmlogn8n-community-learning
    environment:
      - DATABASE_URL=postgresql://dmlogn8n_user:secure_password@postgres:5432/dmlogn8n_education
      - REDIS_URL=redis://redis:6379/6
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
      - ./logs:/app/logs
    ports:
      - "8006:8006"
    depends_on:
      - postgres
      - redis
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped

  research-library:
    build:
      context: .
      dockerfile: Dockerfile.research-library
    container_name: dmlogn8n-research-library
    environment:
      - DATABASE_URL=postgresql://dmlogn8n_user:secure_password@postgres:5432/dmlogn8n_education
      - REDIS_URL=redis://redis:6379/7
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
      - ./logs:/app/logs
      - ./research_papers:/app/research_papers
      - ./temp:/app/temp
    ports:
      - "8007:8007"
    depends_on:
      - postgres
      - redis
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped

  # Supporting Services
  nginx:
    image: nginx:alpine
    container_name: dmlogn8n-education-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./static:/var/www/static:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - learning-platform
      - documentation-generator
      - tutorial-system
      - knowledge-base
      - video-platform
      - certification-system
      - community-learning
      - research-library
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped

  # Monitoring Services
  prometheus:
    image: prom/prometheus:latest
    container_name: dmlogn8n-education-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  grafana:
    image: grafana/grafana:latest
    container_name: dmlogn8n-education-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped

  # Development Services (optional)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: dmlogn8n-education-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped
    profiles:
      - development

  # Background Task Processing
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: dmlogn8n-education-celery-worker
    environment:
      - DATABASE_URL=postgresql://dmlogn8n_user:secure_password@postgres:5432/dmlogn8n_education
      - REDIS_URL=redis://redis:6379/8
      - CELERY_BROKER_URL=redis://redis:6379/8
      - CELERY_RESULT_BACKEND=redis://redis:6379/8
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: dmlogn8n-education-celery-beat
    environment:
      - DATABASE_URL=postgresql://dmlogn8n_user:secure_password@postgres:5432/dmlogn8n_education
      - REDIS_URL=redis://redis:6379/8
      - CELERY_BROKER_URL=redis://redis:6379/8
      - CELERY_RESULT_BACKEND=redis://redis:6379/8
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - dmlogn8n-education-network
    restart: unless-stopped
    command: celery -A app.celery beat --loglevel=info

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  search_index:
    driver: local
  wiki_repo:
    driver: local
  videos:
    driver: local
  uploads:
    driver: local
  processed:
    driver: local
  recordings:
    driver: local
  certificates:
    driver: local
  research_papers:
    driver: local
  temp:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  dmlogn8n-education-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16