<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Character Sheet Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:wght@400;600&family=MedievalSharp&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            font-family: 'Crimson Text', serif;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .character-sheet {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 400px;
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.95), rgba(16, 16, 29, 0.95));
            border: 2px solid #444;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            transform: translateX(450px);
            transition: transform 0.5s ease-in-out;
        }

        .character-sheet.visible {
            transform: translateX(0);
        }

        .character-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .character-name {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .character-class {
            font-family: 'MedievalSharp', cursive;
            font-size: 20px;
            color: #a78bfa;
            margin-bottom: 5px;
        }

        .character-level {
            font-size: 18px;
            color: #64748b;
        }

        .ability-scores {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .ability {
            text-align: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .ability:hover {
            background: rgba(255, 215, 0, 0.1);
            transform: translateY(-2px);
        }

        .ability-name {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .ability-score {
            font-size: 28px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 3px;
        }

        .ability-modifier {
            font-size: 16px;
            color: #22d3ee;
            font-weight: 600;
        }

        .health-bar {
            margin-bottom: 20px;
        }

        .health-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .health-current {
            color: #10b981;
        }

        .health-max {
            color: #64748b;
        }

        .bar-container {
            width: 100%;
            height: 25px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            transition: width 0.5s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .health-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            to {
                left: 100%;
            }
        }

        .health-fill.low {
            background: linear-gradient(90deg, #ef4444, #dc2626);
        }

        .health-fill.medium {
            background: linear-gradient(90deg, #f59e0b, #d97706);
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: #f8fafc;
        }

        .conditions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .condition {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        .spell-slots {
            margin-top: 20px;
        }

        .spell-level {
            margin-bottom: 10px;
        }

        .spell-level-label {
            font-size: 14px;
            color: #a78bfa;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .slot-container {
            display: flex;
            gap: 5px;
        }

        .spell-slot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #a78bfa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .spell-slot.used {
            background: rgba(168, 85, 247, 0.2);
            color: #a78bfa;
        }

        .spell-slot.available {
            background: rgba(168, 85, 247, 0.6);
            color: #fff;
        }

        .equipment {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
        }

        .equipment-title {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            color: #fbbf24;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .equipment-item {
            font-size: 14px;
            color: #e2e8f0;
            margin-bottom: 5px;
            padding-left: 15px;
            position: relative;
        }

        .equipment-item::before {
            content: '⚔️';
            position: absolute;
            left: 0;
        }

        .character-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 3px solid #ffd700;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #64748b;
        }

        .damage-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #ef4444;
            pointer-events: none;
            animation: damageFloat 1s ease-out forwards;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        @keyframes damageFloat {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -200%);
            }
        }

        .heal-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #10b981;
            pointer-events: none;
            animation: healFloat 1s ease-out forwards;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        @keyframes healFloat {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -200%);
            }
        }
    </style>
</head>
<body>
    <div class="character-sheet" id="characterSheet">
        <div class="character-header">
            <div class="character-image" id="characterImage">🧙</div>
            <div class="character-name" id="characterName">Character Name</div>
            <div class="character-class" id="characterClass">Class - Race</div>
            <div class="character-level" id="characterLevel">Level 1</div>
        </div>

        <div class="ability-scores" id="abilityScores">
            <!-- Ability scores will be dynamically populated -->
        </div>

        <div class="health-bar">
            <div class="health-label">
                <span class="health-current">HP: <span id="currentHP">0</span></span>
                <span class="health-max">/ <span id="maxHP">0</span></span>
            </div>
            <div class="bar-container">
                <div class="health-fill" id="healthFill"></div>
            </div>
        </div>

        <div class="stats-section">
            <div class="stat-item">
                <div class="stat-label">Armor Class</div>
                <div class="stat-value" id="armorClass">10</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Speed</div>
                <div class="stat-value" id="speed">30</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Proficiency</div>
                <div class="stat-value" id="proficiency">+2</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Initiative</div>
                <div class="stat-value" id="initiative">+0</div>
            </div>
        </div>

        <div class="conditions" id="conditions">
            <!-- Conditions will be dynamically populated -->
        </div>

        <div class="spell-slots" id="spellSlots">
            <!-- Spell slots will be dynamically populated -->
        </div>

        <div class="equipment" id="equipment">
            <div class="equipment-title">Equipment</div>
            <div id="equipmentList">
                <!-- Equipment items will be dynamically populated -->
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const characterSheet = document.getElementById('characterSheet');

        let currentCharacter = null;

        function updateCharacterSheet(character) {
            currentCharacter = character;

            // Basic info
            document.getElementById('characterName').textContent = character.name || 'Unknown';
            document.getElementById('characterClass').textContent = `${character.class || 'Unknown'} - ${character.race || 'Unknown'}`;
            document.getElementById('characterLevel').textContent = `Level ${character.level || 1}`;

            // Character image/avatar
            const characterImage = document.getElementById('characterImage');
            if (character.avatar) {
                characterImage.innerHTML = `<img src="${character.avatar}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
            } else {
                characterImage.textContent = character.emoji || '🧙';
            }

            // Ability scores
            const abilitiesContainer = document.getElementById('abilityScores');
            abilitiesContainer.innerHTML = '';

            const abilities = [
                { name: 'STR', value: character.strength || 10 },
                { name: 'DEX', value: character.dexterity || 10 },
                { name: 'CON', value: character.constitution || 10 },
                { name: 'INT', value: character.intelligence || 10 },
                { name: 'WIS', value: character.wisdom || 10 },
                { name: 'CHA', value: character.charisma || 10 }
            ];

            abilities.forEach(ability => {
                const modifier = Math.floor((ability.value - 10) / 2);
                const modifierSign = modifier >= 0 ? '+' : '';

                const abilityDiv = document.createElement('div');
                abilityDiv.className = 'ability';
                abilityDiv.innerHTML = `
                    <div class="ability-name">${ability.name}</div>
                    <div class="ability-score">${ability.value}</div>
                    <div class="ability-modifier">${modifierSign}${modifier}</div>
                `;
                abilitiesContainer.appendChild(abilityDiv);
            });

            // Health
            const currentHP = character.currentHP || 0;
            const maxHP = character.maxHP || 1;
            const healthPercentage = (currentHP / maxHP) * 100;

            document.getElementById('currentHP').textContent = currentHP;
            document.getElementById('maxHP').textContent = maxHP;

            const healthFill = document.getElementById('healthFill');
            healthFill.style.width = `${healthPercentage}%`;

            // Change color based on health percentage
            healthFill.classList.remove('low', 'medium');
            if (healthPercentage <= 25) {
                healthFill.classList.add('low');
            } else if (healthPercentage <= 50) {
                healthFill.classList.add('medium');
            }

            // Other stats
            document.getElementById('armorClass').textContent = character.armorClass || 10;
            document.getElementById('speed').textContent = character.speed || 30;
            document.getElementById('proficiency').textContent = `+${character.proficiency || 2}`;
            document.getElementById('initiative').textContent = `+${character.initiative || 0}`;

            // Conditions
            const conditionsContainer = document.getElementById('conditions');
            conditionsContainer.innerHTML = '';

            if (character.conditions && character.conditions.length > 0) {
                character.conditions.forEach(condition => {
                    const conditionDiv = document.createElement('div');
                    conditionDiv.className = 'condition';
                    conditionDiv.textContent = condition;
                    conditionsContainer.appendChild(conditionDiv);
                });
            }

            // Spell slots
            if (character.spellSlots) {
                const spellSlotsContainer = document.getElementById('spellSlots');
                spellSlotsContainer.innerHTML = '<div style="font-family: \'Cinzel\', serif; font-size: 16px; color: #a78bfa; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;">Spell Slots</div>';

                Object.entries(character.spellSlots).forEach(([level, slots]) => {
                    if (slots.total > 0) {
                        const spellLevelDiv = document.createElement('div');
                        spellLevelDiv.className = 'spell-level';
                        spellLevelDiv.innerHTML = `
                            <div class="spell-level-label">Level ${level}</div>
                            <div class="slot-container">
                                ${Array.from({ length: slots.total }, (_, i) => {
                                    const isUsed = i < (slots.total - slots.available);
                                    return `<div class="spell-slot ${isUsed ? 'used' : 'available'}">${isUsed ? '' : slots.available}</div>`;
                                }).join('')}
                            </div>
                        `;
                        spellSlotsContainer.appendChild(spellLevelDiv);
                    }
                });
            }

            // Equipment
            if (character.equipment && character.equipment.length > 0) {
                const equipmentList = document.getElementById('equipmentList');
                equipmentList.innerHTML = '';

                character.equipment.slice(0, 5).forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'equipment-item';
                    itemDiv.textContent = item;
                    equipmentList.appendChild(itemDiv);
                });
            }

            // Show the character sheet
            characterSheet.classList.add('visible');
        }

        function hideCharacterSheet() {
            characterSheet.classList.remove('visible');
        }

        function showDamage(amount) {
            const damageIndicator = document.createElement('div');
            damageIndicator.className = 'damage-indicator';
            damageIndicator.textContent = `-${amount}`;
            characterSheet.appendChild(damageIndicator);

            setTimeout(() => damageIndicator.remove(), 1000);

            // Update HP if we have current character data
            if (currentCharacter && currentCharacter.currentHP) {
                currentCharacter.currentHP = Math.max(0, currentCharacter.currentHP - amount);
                updateCharacterSheet(currentCharacter);
            }
        }

        function showHeal(amount) {
            const healIndicator = document.createElement('div');
            healIndicator.className = 'heal-indicator';
            healIndicator.textContent = `+${amount}`;
            characterSheet.appendChild(healIndicator);

            setTimeout(() => healIndicator.remove(), 1000);

            // Update HP if we have current character data
            if (currentCharacter && currentCharacter.currentHP && currentCharacter.maxHP) {
                currentCharacter.currentHP = Math.min(currentCharacter.maxHP, currentCharacter.currentHP + amount);
                updateCharacterSheet(currentCharacter);
            }
        }

        // Socket events
        socket.on('show-character', updateCharacterSheet);
        socket.on('hide-character', hideCharacterSheet);
        socket.on('update-character', updateCharacterSheet);
        socket.on('character-damage', showDamage);
        socket.on('character-heal', showHeal);

        // Configuration
        socket.on('character-config', (config) => {
            if (config.position) {
                characterSheet.style.top = config.position.top || '20px';
                characterSheet.style.right = config.position.right || '20px';
                characterSheet.style.left = config.position.left || 'auto';
            }
            if (config.size) {
                characterSheet.style.width = config.size.width || '400px';
            }
        });
    </script>
</body>
</html>
