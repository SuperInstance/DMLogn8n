# Continuous Testing Configuration
# Automated performance testing for CI/CD pipelines

tests:
  - name: "Smoke Test - Basic Functionality"
    scenario: "user_journey"
    target_url: "${TARGET_URL:http://localhost:8000}"
    duration: 120  # 2 minutes
    users: 10
    spawn_rate: 2  # users per second
    ramp_up: 10  # seconds
    ramp_down: 10  # seconds
    think_time: 2.0  # seconds between actions
    timeout: 15  # seconds
    headers:
      Content-Type: "application/json"
      User-Agent: "DMLogn8n-CI-Tester/1.0"
    auth:
      type: "session"
      session_cookie: "${CI_SESSION_COOKIE}"
    test_data:
      user_personas: ["casual_gamer"]
      journey_stages: ["login", "dashboard", "basic_interaction"]
      device_types: ["desktop"]
      network_speeds: ["fast"]
    monitoring:
      metrics_interval: 15  # seconds
      basic_monitoring: true
    reporting:
      generate_json: true
      generate_html: false
      generate_dashboard: false
      include_recommendations: true
      ci_integration: true

  - name: "Regression Test - Core Workflows"
    scenario: "user_journey"
    target_url: "${TARGET_URL:http://localhost:8000}"
    duration: 300  # 5 minutes
    users: 50
    spawn_rate: 5  # users per second
    ramp_up: 20  # seconds
    ramp_down: 20  # seconds
    think_time: 1.5  # seconds between actions
    timeout: 20  # seconds
    headers:
      Content-Type: "application/json"
      User-Agent: "DMLogn8n-CI-Tester/1.0"
    auth:
      type: "session"
      session_cookie: "${CI_SESSION_COOKIE}"
    test_data:
      user_personas: ["regular_player", "casual_gamer"]
      journey_stages: ["login", "character_creation", "basic_combat", "dialogue", "logout"]
      device_types: ["desktop", "mobile"]
      network_speeds: ["fast"]
    monitoring:
      metrics_interval: 10  # seconds
      regression_monitoring: true
      baseline_comparison: true
    reporting:
      generate_json: true
      generate_html: false
      generate_dashboard: false
      include_recommendations: true
      ci_integration: true
      baseline_comparison: true
      regression_detection: true

  - name: "API Performance Test"
    scenario: "agent_simulation"
    target_url: "${TARGET_URL:http://localhost:8000}"
    duration: 180  # 3 minutes
    users: 100
    spawn_rate: 10  # agents per second
    ramp_up: 15  # seconds
    ramp_down: 15  # seconds
    think_time: 1.0  # seconds between actions
    timeout: 15  # seconds
    headers:
      Content-Type: "application/json"
      User-Agent: "DMLogn8n-CI-Tester/1.0"
    auth:
      type: "bearer"
      token: "${CI_AUTH_TOKEN}"
    test_data:
      agent_types: ["dm_assistant", "npc", "combat_agent"]
      complexity_levels: [5, 7]
      interaction_patterns: ["sequential", "random"]
      memory_sizes: [256, 512]  # MB
    monitoring:
      metrics_interval: 8  # seconds
      api_monitoring: true
      endpoint_tracking: true
    reporting:
      generate_json: true
      generate_html: false
      generate_dashboard: false
      include_recommendations: true
      ci_integration: true
      endpoint_performance: true

  - name: "Integration Test - Multi-System"
    scenario: "user_journey"
    target_url: "${TARGET_URL:http://localhost:8000}"
    duration: 600  # 10 minutes
    users: 200
    spawn_rate: 15  # users per second
    ramp_up: 30  # seconds
    ramp_down: 30  # seconds
    think_time: 1.2  # seconds between actions
    timeout: 25  # seconds
    headers:
      Content-Type: "application/json"
      User-Agent: "DMLogn8n-CI-Tester/1.0"
    auth:
      type: "session"
      session_cookie: "${CI_SESSION_COOKIE}"
    test_data:
      user_personas: ["regular_player", "social_player", "explorer"]
      journey_stages: ["login", "character_management", "session_join", "combat", "dialogue", "social_features"]
      device_types: ["desktop", "mobile", "tablet"]
      network_speeds: ["average", "fast"]
      cross_system_integration: true
    monitoring:
      metrics_interval: 10  # seconds
      integration_monitoring: true
      system_health_tracking: true
    reporting:
      generate_json: true
      generate_html: true  # Generate HTML for integration tests
      generate_dashboard: false
      include_recommendations: true
      ci_integration: true
      integration_analysis: true

# Global settings
global:
  # Load testing parameters
  max_concurrent_tests: 1  # Sequential execution for CI
  test_cleanup: true
  resource_monitoring: true
  fast_execution: true

  # CI/CD specific settings
  ci_integration: true
  exit_on_failure: true
  fail_fast: true
  timeout: 3600  # 1 hour total timeout

  # Baseline and regression settings
  baseline_management: true
  baseline_file: "./baselines/ci_baseline.json"
  regression_threshold: 10.0  # %
  auto_baseline_update: false

  # Database settings
  metrics_storage: "sqlite"
  metrics_retention_days: 7  # Short retention for CI

  # Reporting settings
  reports_output_dir: "./reports/ci"
  json_output: true
  junit_output: true
  summary_output: true

  # Alerting settings
  alert_thresholds:
    response_time_p95: 1000  # ms
    error_rate: 2.0  # %
    cpu_usage: 80.0  # %
    memory_usage: 80.0  # %

  # CI/CD platform integration
  platforms:
    github_actions:
      annotations: true
      check_runs: true
      artifacts: true
    jenkins:
      junit_reports: true
      performance_trends: true
    gitlab_ci:
      test_reports: true
      performance_reports: true
    circleci:
      test_results: true
      artifacts: true

# Environment-specific overrides
environments:
  development:
    target_url: "http://localhost:8000"
    users_multiplier: 1.0
    monitoring:
      detailed_logging: true
      debug_mode: true
    ci_integration:
      fail_fast: false  # More lenient in development

  feature_branch:
    target_url: "${FEATURE_BRANCH_URL}"
    users_multiplier: 0.5
    monitoring:
      basic_monitoring: true
    ci_integration:
      annotations: true
      artifacts: false

  staging:
    target_url: "${STAGING_URL:https://staging.dmlogn8n.com}"
    users_multiplier: 0.8
    monitoring:
      integration_monitoring: true
    ci_integration:
      check_runs: true
      artifacts: true

  production:
    target_url: "${PRODUCTION_URL:https://api.dmlogn8n.com}"
    users_multiplier: 0.2  # Conservative for production
    monitoring:
      production_monitoring: true
      privacy_mode: true
    ci_integration:
      annotations: true
      artifacts: false
      check_runs: true
    auth:
      type: "oauth2"
      client_id: "${PROD_OAUTH_CLIENT_ID}"
      client_secret: "${PROD_OAUTH_CLIENT_SECRET}"
      scope: "ci_testing"

# Performance gates and quality gates
performance_gates:
  smoke_test:
    response_time_p95: 500  # ms
    error_rate: 1.0  # %
    throughput: 10  # req/s

  regression_test:
    response_time_p95: 1000  # ms
    error_rate: 2.0  # %
    throughput: 50  # req/s
    regression_threshold: 15.0  # %

  integration_test:
    response_time_p95: 1500  # ms
    error_rate: 3.0  # %
    throughput: 100  # req/s

# Notification settings
notifications:
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK_URL}"
    channel: "#performance"
    on_failure: true
    on_regression: true

  email:
    enabled: false
    smtp_server: "${SMTP_SERVER}"
    recipients: "${NOTIFICATION_EMAILS}"
    on_failure: true
    on_regression: true

# Artifact management
artifacts:
  retention_days: 30
  compression: true
  formats: ["json", "junit", "summary"]
  upload_to_s3: false
  s3_bucket: "${CI_ARTIFACTS_BUCKET}"