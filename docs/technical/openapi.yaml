          type: string
          pattern: '^\d+d\d+(?:\s*[+-]\s*\d+)?$'
          description: Dice notation (e.g., "2d6+3", "1d20", "4d8-2")
          example: "2d6+3"
        character_id:
          type: string
          format: uuid
          description: Character UUID (optional)
        reason:
          type: string
          maxLength: 200
          description: Reason for the roll
          example: "Attack roll with longsword"
        advantage:
          type: boolean
          default: false
          description: Roll with advantage
        disadvantage:
          type: boolean
          default: false
          description: Roll with disadvantage
        critical_threshold:
          type: integer
          minimum: 1
          maximum: 20
          default: 20
          description: Critical hit threshold

    DiceRollResponse:
      type: object
      required:
        - roll
        - result
        - individual_rolls
      properties:
        roll:
          type: string
          description: Dice notation that was rolled
          example: "2d6+3"
        result:
          type: integer
          description: Final result
          example: 15
        individual_rolls:
          type: array
          items:
            type: integer
          description: Individual die results
          example: [6, 4]
        modifier:
          type: integer
          description: Applied modifier
          example: 3
        is_critical:
          type: boolean
          description: Whether the roll was a critical hit
        is_critical_fail:
          type: boolean
          description: Whether the roll was a critical fail
        character_id:
          type: string
          format: uuid
          description: Character UUID
        reason:
          type: string
          description: Reason for the roll
        timestamp:
          type: string
          format: date-time
          description: Roll timestamp

